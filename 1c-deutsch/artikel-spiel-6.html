<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>der · die · das – Artikel, ein · eine und Mehrzahl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #FFF0C2;
    --bg-dot: rgba(27,33,64,0.09);
    --card: #FFFFFF;
    --card-2: #FFF8E1;
    --ink: #1B2140;
    --ink-soft: rgba(27,33,64,0.72);
    --edge: #1B2140;
    --focus: #2563EB;

    --der: #2563EB;
    --die: #E11D48;
    --das: #059669;
    --der-t: #1D4ED8;
    --die-t: #BE123C;
    --das-t: #047857;

    --t0: #FB923C;
    --t1: #A78BFA;
    --on-team: #1B2140;
    --gold: #FFC629;
    --on-gold: #1B2140;
    --good-t: #047857;
    --bad-t: #BE123C;

    --display: 'Lilita One', 'Baloo 2', 'Segoe UI', system-ui, sans-serif;
    --word: 'Andika', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141833;
      --bg-dot: rgba(255,255,255,0.07);
      --card: #232A55;
      --card-2: #1A2046;
      --ink: #F6F4FF;
      --ink-soft: rgba(246,244,255,0.78);
      --edge: #070917;
      --focus: #FFC629;
      --der-t: #7FA8FF;
      --die-t: #FF7C95;
      --das-t: #34D399;
      --good-t: #34D399;
      --bad-t: #FF7C95;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141833;
    --bg-dot: rgba(255,255,255,0.07);
    --card: #232A55;
    --card-2: #1A2046;
    --ink: #F6F4FF;
    --ink-soft: rgba(246,244,255,0.78);
    --edge: #070917;
    --focus: #FFC629;
    --der-t: #7FA8FF;
    --die-t: #FF7C95;
    --das-t: #34D399;
    --good-t: #34D399;
    --bad-t: #FF7C95;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 2.5px, transparent 2.6px);
    background-size: 30px 30px;
    color: var(--ink);
    font-family: var(--word);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  h1, h2, p { margin: 0; }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: var(--display); font-size: 1.2rem; line-height: 1.1;
    background: var(--card); color: var(--ink);
    border: 3px solid var(--edge); border-radius: 16px;
    padding: 10px 18px; box-shadow: 0 5px 0 var(--edge);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--edge); }
  .btn:focus-visible, .opt:focus-visible, .pill:focus-visible, .tile:focus-visible, .bin:focus-visible, .pl-opt:focus-visible, input:focus-visible {
    outline: 4px solid var(--focus); outline-offset: 3px;
  }
  .btn.gold { background: var(--gold); color: var(--on-gold); }
  .btn.sm { font-size: 1rem; padding: 8px 14px; border-radius: 14px; box-shadow: 0 4px 0 var(--edge); }
  .btn.big { font-size: clamp(1.5rem, 3.6vw, 2.5rem); padding: 16px 38px; border-radius: 24px; box-shadow: 0 8px 0 var(--edge); }
  .btn.big:active { transform: translateY(8px); }
  .btn.armed { background: var(--die); color: #fff; }

  /* ---------- Menü ---------- */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .floaty { position: absolute; font-size: clamp(2.2rem, 4.5vw, 3.8rem); animation: float 6s ease-in-out infinite; }
  @media (max-width: 1150px) { .deco { display: none; } }
  .menu-inner {
    position: relative; z-index: 1;
    max-width: 1000px; margin: 0 auto;
    padding: clamp(18px, 4vw, 40px) clamp(14px, 3vw, 28px) 36px;
  }
  .logo { display: flex; justify-content: center; gap: clamp(10px, 2.4vw, 22px); flex-wrap: wrap; font-family: var(--display); font-weight: 400; }
  .lg {
    font-size: clamp(3.2rem, 13vw, 7.5rem); line-height: 1; color: #fff;
    padding: .04em .28em .12em; border: 4px solid var(--edge); border-radius: .3em; box-shadow: 0 9px 0 var(--edge);
  }
  .lg.der { background: var(--der); transform: rotate(-3deg); }
  .lg.die { background: var(--die); transform: rotate(2deg); }
  .lg.das { background: var(--das); transform: rotate(-2deg); }
  .tagline { text-align: center; font-family: var(--display); font-size: clamp(1.25rem, 3vw, 2rem); margin: 26px 0 26px; }

  .step { margin-bottom: 22px; }
  .step h2 {
    font-family: var(--display); font-weight: 400; font-size: clamp(1.25rem, 2.8vw, 1.8rem);
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .num {
    display: inline-grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 50%;
    background: var(--gold); color: var(--on-gold); border: 3px solid var(--edge); font-size: .9em;
  }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .opt {
    position: relative; text-align: left; display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; background: var(--card); color: var(--ink);
    border: 3px solid var(--edge); border-radius: 22px; box-shadow: 0 6px 0 var(--edge);
    transition: transform .1s, background .15s;
  }
  .opt .ico { font-size: clamp(1.8rem, 3.6vw, 2.6rem); line-height: 1; flex: none; min-width: 3.2rem; text-align: center; }
  .opt .ot { display: block; font-family: var(--display); font-size: clamp(1.2rem, 2.5vw, 1.6rem); }
  .opt .od { display: block; margin-top: 3px; font-size: clamp(.92rem, 1.7vw, 1.05rem); line-height: 1.35; color: var(--ink-soft); }
  .opt.wide { grid-column: 1 / -1; }
  .opt[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); transform: translateY(-3px); box-shadow: 0 9px 0 var(--edge); }
  .opt[aria-pressed="true"] .od { color: rgba(27,33,64,0.82); }
  .opt[aria-pressed="true"]::after {
    content: "✓"; position: absolute; top: -14px; right: -8px; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center; background: var(--das); color: #fff; border: 3px solid var(--edge);
    font-family: var(--display); font-size: 1.2rem;
  }
  .pills { display: flex; gap: 14px; flex-wrap: wrap; }
  .pill {
    font-family: var(--display); font-size: clamp(1.3rem, 3vw, 1.9rem); min-width: 88px;
    padding: 10px 24px; background: var(--card); color: var(--ink);
    border: 3px solid var(--edge); border-radius: 18px; box-shadow: 0 5px 0 var(--edge);
  }
  .pill[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); transform: translateY(-2px); box-shadow: 0 7px 0 var(--edge); }
  .pills { align-items: center; }
  .count-own { font-family: var(--display); font-size: clamp(1.05rem, 2.2vw, 1.4rem); margin-left: 8px; }
  .count-input {
    width: 7.5em; font: 700 clamp(1.3rem, 3vw, 1.9rem) var(--word); color: var(--ink); background: var(--card);
    border: 3px solid var(--edge); border-radius: 18px; padding: 8px 14px; box-shadow: 0 5px 0 var(--edge); text-align: center;
  }
  .count-input.on { background: var(--gold); color: var(--on-gold); box-shadow: 0 7px 0 var(--edge); transform: translateY(-2px); }
  .count-hint { margin-top: 12px; min-height: 1.4em; font-size: clamp(.95rem, 1.8vw, 1.1rem); color: var(--ink-soft); }
  .count-hint.warn { color: var(--bad-t); font-weight: 700; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field label { display: block; font-family: var(--display); font-size: 1.1rem; margin-bottom: 6px; }
  .field input {
    width: 100%; font: 700 clamp(1.1rem, 2.4vw, 1.4rem) var(--word); color: var(--ink); background: var(--card);
    border: 3px solid var(--edge); border-radius: 16px; padding: 12px 16px;
  }
  .field.f0 input { box-shadow: 0 5px 0 var(--t0); }
  .field.f1 input { box-shadow: 0 5px 0 var(--t1); }
  .rule {
    margin-top: 6px; padding: 14px 18px; background: var(--card-2); color: var(--ink);
    border: 3px dashed var(--ink-soft); border-radius: 20px; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.45;
  }
  .start-row { text-align: center; margin-top: 26px; }
  .pool-info { margin: 22px 0 12px; font-size: clamp(1rem, 2vw, 1.15rem); color: var(--ink-soft); }
  .foot { text-align: center; color: var(--ink-soft); margin-top: 26px; font-size: .95rem; }

  /* ---------- Spielfeld ---------- */
  .game { max-width: 1400px; margin: 0 auto; padding: 14px clamp(12px, 2vw, 28px) 32px; user-select: none; -webkit-user-select: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .tb-right { display: flex; gap: 10px; }
  .progress {
    font-family: var(--display); font-size: clamp(1rem, 2.2vw, 1.5rem);
    background: var(--card); border: 3px solid var(--edge); border-radius: 999px; padding: 6px 22px; box-shadow: 0 4px 0 var(--edge);
    text-align: center;
  }

  .board { --tile-fs: clamp(1.9rem, 4.4vw, 3.2rem); --chip-fs: clamp(1.1rem, 2.2vw, 1.7rem); }
  .board.n15 { --tile-fs: clamp(1.7rem, 3.8vw, 2.8rem); }
  .board.n20 { --tile-fs: clamp(1.5rem, 3.3vw, 2.4rem); }
  .board.mode-groups { --tile-fs: clamp(1.4rem, 2.9vw, 2.6rem); --chip-fs: clamp(1rem, 1.8vw, 1.4rem); }
  .board.mode-groups.n15 { --tile-fs: clamp(1.3rem, 2.5vw, 2.2rem); }
  .board.mode-groups.n20 { --tile-fs: clamp(1.2rem, 2.2vw, 2rem); }
  .board.n40 { --tile-fs: clamp(1.3rem, 2.8vw, 2.1rem); --chip-fs: clamp(.95rem, 1.7vw, 1.3rem); }
  .board.n100 { --tile-fs: clamp(1.1rem, 2.2vw, 1.7rem); --chip-fs: clamp(.85rem, 1.4vw, 1.1rem); }
  .board.mode-groups.n40 { --tile-fs: clamp(1.1rem, 2vw, 1.7rem); --chip-fs: clamp(.85rem, 1.3vw, 1.1rem); }
  .board.mode-groups.n100 { --tile-fs: clamp(.95rem, 1.6vw, 1.3rem); --chip-fs: clamp(.8rem, 1.2vw, 1rem); }

  /* Klasse gegen Lehrerin */
  .versus { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: clamp(8px, 2vw, 18px); align-items: center; margin-bottom: 18px; }
  .score {
    --tc: var(--t0);
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--tc); color: var(--on-team);
    border: 4px solid var(--edge); border-radius: 26px; box-shadow: 0 7px 0 var(--edge);
  }
  .score.t1 { --tc: var(--t1); flex-direction: row-reverse; }
  .emoji { font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1; }
  .nm, .pname {
    font-family: var(--display); font-size: clamp(1.1rem, 2.8vw, 2rem);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pts {
    font-family: var(--display); font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1;
    min-width: 1.6em; text-align: center; padding: 0 .3em;
    background: rgba(255,255,255,0.6); border-radius: 16px; margin-left: auto;
  }
  .score.t1 .pts { margin-left: 0; margin-right: auto; }
  .vs {
    display: grid; place-items: center; width: clamp(46px, 6vw, 68px); aspect-ratio: 1; border-radius: 50%;
    background: var(--gold); color: var(--on-gold); border: 3px solid var(--edge);
    font-family: var(--display); font-size: clamp(1.1rem, 2.4vw, 1.7rem);
  }
  .bump .pts { animation: bump .6s; }

  /* Wort-Karte */
  .stage { margin-bottom: 20px; }
  .wordcard {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .25em;
    min-height: clamp(170px, 28vh, 340px); padding: clamp(16px, 3vw, 40px);
    background: var(--card); color: var(--ink);
    border: 4px solid var(--edge); border-radius: 38px; box-shadow: 0 10px 0 var(--edge);
    font-family: var(--word); font-weight: 700; font-size: clamp(3.4rem, 13vw, 10rem); line-height: 1.1; text-align: center;
    overflow-wrap: anywhere;
  }
  .wordcard.enter { animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
  .mode-groups .wordcard { font-size: clamp(3rem, 8.5vw, 7rem); min-height: clamp(130px, 20vh, 250px); }
  .wc-art { display: inline-block; min-width: 1.7em; padding: 0 .1em; text-align: center; border-radius: .25em; }
  .wc-art.ph { color: var(--ink-soft); border: .05em dashed var(--ink-soft); }
  .wc-art.der { color: var(--der-t); }
  .wc-art.die { color: var(--die-t); }
  .wc-art.das { color: var(--das-t); }
  .wc-art.pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }

  .feedback { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 18px; min-height: 68px; }
  .fb-text { font-family: var(--display); font-size: clamp(1.15rem, 2.6vw, 1.9rem); text-align: center; }
  .fb-text.ok { color: var(--good-t); }
  .fb-text.bad { color: var(--bad-t); }
  .hint { font-family: var(--display); font-size: clamp(1rem, 2.1vw, 1.5rem); text-align: center; color: var(--ink-soft); margin: 0 0 10px; min-height: 1.4em; }

  /* Wörter-Kasten */
  .pool {
    display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: clamp(8px, 1.4vw, 14px);
    padding: clamp(10px, 1.6vw, 18px); min-height: clamp(96px, 16vh, 190px);
    background: var(--card-2); border: 3px dashed var(--ink-soft); border-radius: 26px;
  }
  .pool.empty { align-items: center; font-family: var(--display); font-size: clamp(1.2rem, 2.6vw, 2rem); color: var(--good-t); }
  .tile {
    font-family: var(--word); font-weight: 700; font-size: var(--tile-fs); line-height: 1.1;
    padding: .3em .7em; background: var(--card); color: var(--ink);
    border: 3px solid var(--edge); border-radius: 18px; box-shadow: 0 6px 0 var(--edge);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge); }
  .tile.sel { background: var(--tc, var(--gold)); color: #1B2140; transform: translateY(-6px) rotate(-2deg); box-shadow: 0 12px 0 var(--edge); }

  /* der / die / das */
  .bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.6vw, 18px); }
  .bin {
    --ac: var(--der);
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
    min-height: clamp(120px, 20vh, 210px); padding: 12px 10px 16px;
    background: var(--ac); color: #fff;
    border: 4px solid var(--edge); border-radius: 28px; box-shadow: 0 8px 0 var(--edge);
    font-family: var(--word); font-weight: 700;
    transition: transform .08s, box-shadow .08s, opacity .2s, filter .2s;
  }
  .bin[data-art="der"] { --ac: var(--der); }
  .bin[data-art="die"] { --ac: var(--die); }
  .bin[data-art="das"] { --ac: var(--das); }
  .bin:disabled { color: #fff; }
  .bin-label { font-size: clamp(2.4rem, 7vw, 5.6rem); line-height: 1; margin: auto; }
  .mode-groups .bin-label { font-size: clamp(1.9rem, 4.2vw, 3.6rem); }
  .bin:not(:disabled):active { transform: translateY(8px); box-shadow: 0 0 0 var(--edge); }
  @media (hover: hover) { .bin:not(:disabled):hover { filter: brightness(1.1); } }
  .bin.dim, .pl-opt.dim { opacity: .38; filter: saturate(.5); }
  .bin.wrongpick, .pl-opt.wrongpick { opacity: 1; filter: grayscale(.85) brightness(.75); }
  .bin.wrongpick::after, .pl-opt.wrongpick::after {
    content: "✗"; position: absolute; top: -14px; right: -10px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--die); color: #fff; border: 3px solid var(--edge);
    font-family: var(--display); font-size: 1.5rem;
  }
  .bin.reveal, .pl-opt.reveal { opacity: 1; filter: none; outline: 6px solid var(--gold); outline-offset: 3px; animation: pulse .9s ease-in-out 2; }
  .bin.hitbad { animation: shake .45s; }
  .task-tiles .bin { min-height: clamp(180px, 30vh, 330px); }
  .task-tiles .bin-label { font-size: clamp(1.9rem, 4.6vw, 3.4rem); margin: 0; }
  .task-tiles.mode-groups .bin-label { font-size: clamp(1.7rem, 3.4vw, 2.8rem); }
  .task-tiles .bin.ready { animation: glow 1.1s ease-in-out infinite; }
  .bin-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
  .chip {
    font-family: var(--word); font-weight: 700; font-size: var(--chip-fs); line-height: 1.15;
    padding: .18em .7em; background: var(--card); color: var(--ink);
    border: 2px solid var(--edge); border-radius: 999px;
  }
  .chip.new { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .chip.miss { background: #FFE4E6; color: #9F1239; border-style: dashed; }

  /* Gruppe gegen Gruppe */
  .split { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "stage stage" "p0 p1"; gap: clamp(10px, 2vw, 22px); }
  .split .stage { grid-area: stage; margin-bottom: 0; }
  .task-tiles.mode-groups .split { grid-template-areas: "p0 p1"; }
  .panel {
    --tc: var(--t0);
    position: relative; display: flex; flex-direction: column; gap: 12px; padding: clamp(10px, 1.6vw, 18px);
    background: var(--card);
    background: color-mix(in srgb, var(--tc) 34%, var(--card));
    border: 4px solid var(--edge); border-radius: 34px; box-shadow: 0 10px 0 var(--edge);
  }
  .panel.p0 { grid-area: p0; --tc: var(--t0); }
  .panel.p1 { grid-area: p1; --tc: var(--t1); }
  .panel-head {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--tc); color: var(--on-team); border: 3px solid var(--edge); border-radius: 22px;
  }
  .panel-head .emoji { font-size: clamp(1.6rem, 3vw, 2.4rem); }
  .panel-head .pname { flex: 1; }
  .panel-head .pts { font-size: clamp(1.8rem, 4vw, 3rem); }
  .panel .hint { color: var(--ink); opacity: .85; margin: 0; }
  .panel.shakep { animation: shake .5s; }
  .freeze {
    position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; text-align: center;
    border-radius: 30px; background: rgba(20,24,51,0.78); color: #fff;
    font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.4rem); animation: fadein .15s;
  }
  @media (max-aspect-ratio: 1/1), (max-width: 720px) {
    .split { grid-template-columns: 1fr; grid-template-areas: "p0" "stage" "p1"; }
    .task-tiles.mode-groups .split { grid-template-areas: "p0" "p1"; }
    .opts, .names { grid-template-columns: 1fr; }
  }

  /* ---------- Menü: automatische Nummerierung (Schritte können ausgeblendet sein) ---------- */
  .menu-inner { counter-reset: step; }
  .num { counter-increment: step; }
  .num::before { content: counter(step); }

  /* ---------- Mehrzahl-Maschine ---------- */
  .rulebar {
    margin: 0 0 18px; padding: 10px 20px; text-align: center;
    background: var(--card-2); color: var(--ink);
    border: 3px dashed var(--ink-soft); border-radius: 999px;
    font-family: var(--display); font-size: clamp(1.05rem, 2.4vw, 1.7rem); line-height: 1.25;
  }
  .rulebar b { color: var(--die-t); font-weight: 400; }
  .plcard {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch;
    gap: clamp(8px, 2vw, 24px); min-height: clamp(150px, 26vh, 300px);
  }
  .plcard.enter { animation: pop .45s cubic-bezier(.3,1.5,.5,1); }
  .plside {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2em;
    min-width: 0; padding: clamp(12px, 2vw, 28px); text-align: center;
    background: var(--card); color: var(--ink);
    border: 4px solid var(--edge); border-radius: 34px; box-shadow: 0 10px 0 var(--edge);
  }
  .plside.pl { background: var(--card); background: color-mix(in srgb, var(--die) 13%, var(--card)); }

  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

  }

  /* ---------- Bestimmt & unbestimmt: Gruppe gegen Gruppe (geteilter Bildschirm, eigene Wörter) ---------- */

<body>

<div id="menu">

        </button>
        <button type="button" class="opt wide" data-topic="indef" aria-pressed="false">
          <span class="ico" aria-hidden="true">🔤</span>

    <section class="step" id="stepTask" aria-labelledby="h-task">

          <span class="ico" aria-hidden="true">🃏</span>

        <div class="field f0"><label for="name0">🟠 Links</label><input id="name0" maxlength="16" autocomplete="off"></div>
        <div class="field f1"><label for="name1">🟣 Rechts</label><input id="name1" maxlength="16" autocomplete="off"></div>
      </div>

    <p class="rule" id="rule"></p>

    <div class="start-row">
      <button type="button" class="btn gold big" id="btnStart">Los geht’s! ▶</button>
      <p class="pool-info" id="poolInfo"></p>
      <button type="button" class="btn sm" id="btnPoolReset">🔄 Wörter neu mischen</button>
    </div>
    <p class="foot">Klasse 2 · Grundschule Böhlitz-Ehrenberg</p>

</div>

<div id="game" class="game" hidden>
  <div class="topbar">

      <button type="button" class="btn sm" id="btnSound" aria-label="Ton an oder aus">🔊</button>
      <button type="button" class="btn sm" id="btnRestart">↻ Neu</button>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="endModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="endTitle">

    <div class="modal-emoji" id="endEmoji" aria-hidden="true">🏆</div>

      <button type="button" class="btn big" id="btnMenuEnd">Menü</button>

  </div>
</div>

<div id="fx" class="fx" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  // 100 Nomen für Klasse 2: [Wort, Artikel, Bild]. 33 × der, 34 × die, 33 × das.
  var WORDS = [
    // der
    ['Hund','der','🐶'],['Fisch','der','🐟'],['Vogel','der','🐦'],['Hase','der','🐰'],['Bär','der','🐻'],
    ['Löwe','der','🦁'],['Affe','der','🐵'],['Frosch','der','🐸'],['Igel','der','🦔'],['Elefant','der','🐘'],
    ['Pinguin','der','🐧'],['Tiger','der','🐯'],['Baum','der','🌳'],['Apfel','der','🍎'],['Ball','der','⚽'],
    ['Stuhl','der','🪑'],['Schuh','der','👟'],['Hut','der','🎩'],['Zug','der','🚂'],['Bus','der','🚌'],
    ['Mond','der','🌙'],['Besen','der','🧹'],['Kuchen','der','🍰'],['Keks','der','🍪'],['Löffel','der','🥄'],
    ['Teller','der','🍽️'],['Zahn','der','🦷'],['Stern','der','⭐'],['Rucksack','der','🎒'],['Schlüssel','der','🔑'],
    ['Pilz','der','🍄'],['Berg','der','⛰️'],['Wald','der','🌲'],
    // die
    ['Katze','die','🐱'],['Maus','die','🐭'],['Kuh','die','🐮'],['Ente','die','🦆'],['Biene','die','🐝'],
    ['Eule','die','🦉'],['Giraffe','die','🦒'],['Schlange','die','🐍'],['Spinne','die','🕷️'],['Blume','die','🌸'],
    ['Sonne','die','☀️'],['Wolke','die','☁️'],['Banane','die','🍌'],['Birne','die','🍐'],['Tomate','die','🍅'],
    ['Erdbeere','die','🍓'],['Torte','die','🎂'],['Pizza','die','🍕'],['Tasche','die','👜'],['Zitrone','die','🍋'],
    ['Jacke','die','🧥'],['Hose','die','👖'],['Brille','die','👓'],['Uhr','die','🕐'],['Tür','die','🚪'],
    ['Kerze','die','🕯️'],['Schere','die','✂️'],['Gabel','die','🍴'],['Tasse','die','☕'],['Gitarre','die','🎸'],
    ['Nase','die','👃'],['Schule','die','🏫'],['Rakete','die','🚀'],['Krone','die','👑'],
    // das
    ['Haus','das','🏠'],['Buch','das','📖'],['Kind','das','🧒'],['Auto','das','🚗'],['Fenster','das','🪟'],
    ['Bett','das','🛏️'],['Herz','das','❤️'],['Auge','das','👁️'],['Ohr','das','👂'],['Bein','das','🦵'],
    ['Boot','das','⛵'],['Ei','das','🥚'],['Eis','das','🍦'],['Brot','das','🍞'],['Bild','das','🖼️'],
    ['Fahrrad','das','🚲'],['Pferd','das','🐴'],['Schaf','das','🐑'],['Schwein','das','🐖'],['Huhn','das','🐔'],
    ['Kleid','das','👗'],['Mädchen','das','👧'],['Baby','das','👶'],['Telefon','das','☎️'],['Radio','das','📻'],
    ['Zelt','das','⛺'],['Schiff','das','🚢'],['Lied','das','🎵'],['Sofa','das','🛋️'],['Krokodil','das','🐊'],
    ['Nilpferd','das','🦛'],['Känguru','das','🦘'],['Zebra','das','🦓']
  ];
  var WMAP = {};
  WORDS.forEach(function (r) { WMAP[r[0]] = r; });
  var ARTS = ['der', 'die', 'das'];
  var STORE = 'artikelspiel-v1';
  var DEFAULT_NAMES = { teacher: ['Klasse', 'Lehrerin'], groups: ['Gruppe 1', 'Gruppe 2'] };
  var EMOJI = { teacher: ['🎒', '🍎'], groups: ['🦊', '🐙'] };
  var COLORS = ['#2563EB', '#E11D48', '#059669', '#FFC629', '#FB923C', '#A78BFA'];
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var S = {
    mode: 'teacher', topic: 'article', task: 'tiles', eff: 'tiles', count: 10, sound: true,
    names: { teacher: DEFAULT_NAMES.teacher.slice(), groups: DEFAULT_NAMES.groups.slice() },
    words: [], idx: 0, score: [0, 0], picks: [null, null], res: null,
    pool: [], sel: [null, null], frozen: [false, false], bins: null,
    fx: {}, over: false, timers: [], phase: 1, G: null
  };

  function $(id) { return document.getElementById(id); }
  function qsa(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- Speichern ---------- */
  function load() {
    try {
      var raw = window.localStorage.getItem(STORE);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d.mode === 'teacher' || d.mode === 'groups') S.mode = d.mode;
      if (d.topic === 'article' || d.topic === 'plural' || d.topic === 'indef') S.topic = d.topic;
      if (d.task === 'tiles' || d.task === 'single') S.task = d.task;
      if (typeof d.count === 'number' && d.count >= 1 && d.count <= 100 && Math.floor(d.count) === d.count) S.count = d.count;
      if (typeof d.sound === 'boolean') S.sound = d.sound;
      ['teacher', 'groups'].forEach(function (m) {
        if (d.names && Array.isArray(d.names[m]) && d.names[m].length === 2) {
          S.names[m] = [String(d.names[m][0]).slice(0, 16), String(d.names[m][1]).slice(0, 16)];
        }
      });
    } catch (e) { /* ohne Speicher weiterspielen */ }
  }
  function save() {
    try {
      window.localStorage.setItem(STORE, JSON.stringify({ mode: S.mode, topic: S.topic, task: S.task, count: S.count, sound: S.sound, names: S.names }));
    } catch (e) { /* egal */ }
  }

  /* ---------- Ton & Konfetti ---------- */
  var audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function tone(freq, delay, dur, type) {
    if (!audioCtx) return;
    var t = audioCtx.currentTime + delay;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function sound(kind) {
    if (!S.sound) return;
    ensureAudio();

  function wordCardHTML() {

  }
  function feedbackHTML() {

    var pl = S.topic === 'plural', ind = S.topic === 'indef', two = pl || ind;
    var full = pl ? '„' + cur.a + ' ' + esc(cur.w) + '“ → „die ' + esc(cur.p) + '“'
      : ind ? '„' + cur.a + ' ' + esc(cur.w) + '“ → „' + cur.ind + ' ' + esc(cur.w) + '“'

        else if (S.picks[1] !== null) txt = esc(n[1]) + ' liegt falsch – ' + esc(n[0]) + ' darf noch!';

        txt = '✅ „' + cur.a + ' ' + esc(cur.w) + '“ stimmt! ' + (ind ? 'Schritt 2: Welcher unbestimmte Artikel passt: ein oder eine?' : 'Schritt 2: Wie heißt die Mehrzahl?');
        return '<div class="feedback"><p class="fb-text ok">' + txt + '</p></div>';

      if (S.mode === 'teacher') txt = pl ? 'Wie heißt die Mehrzahl von „' + esc(cur.w) + '“?' : 'Welcher Artikel passt: der, die oder das?';
      else if (S.picks[0] !== null) txt = esc(n[0]) + ' liegt falsch – ' + esc(n[1]) + ' darf noch!';
      else if (S.picks[1] !== null) txt = esc(n[1]) + ' liegt falsch – ' + esc(n[0]) + ' darf noch!';
      else txt = pl ? 'Schnell! Tippt die richtige Mehrzahl!' : 'Schnell! Tippt auf der, die oder das!';
      return '<div class="feedback"><p class="fb-text">' + txt + '</p></div>';
    }
    if (S.mode === 'teacher') {
      if (S.res.ok) { cls = 'ok'; txt = '🎉 Richtig! ' + full + ' – Punkt für ' + esc(n[0]) + '!'; }
      else if (S.res.step === 1) { cls = 'bad'; txt = '❌ Der Artikel war falsch: Es heißt ' + full + '. Punkt für ' + esc(n[1]) + '!'; }

    } else if (S.res.winner >= 0) {
      cls = 'ok'; txt = '🎉 ' + esc(n[S.res.winner]) + ' war zuerst richtig: ' + full + ' (+1)';
    } else {
      cls = 'bad'; txt = '😅 Beide falsch. Es heißt ' + full + '.';
    }
    var last = S.idx >= S.words.length - 1;
    return '<div class="feedback"><p class="fb-text ' + cls + '">' + txt + '</p>' +
      '<button type="button" class="btn gold big" data-act="next">' + (last ? 'Ergebnis 🏆' : 'Weiter ▶') + '</button></div>';
  }
  function stageHTML() {
    if (S.eff === 'single') return '<div class="stage">' + (S.topic === 'plural' ? plCardHTML() : S.topic === 'indef' ? indefCardHTML() : wordCardHTML()) + feedbackHTML() + '</div>';
    var w = selWord(0);

    return '<div class="stage"><p class="hint">' + hint + '</p>' + poolHTML(0) + '</div>';
  }
  function scoreCard(t) {
    return '<div class="score t' + t + (S.fx.bump === t ? ' bump' : '') + '">' +
      '<span class="emoji" aria-hidden="true">' + EMOJI.teacher[t] + '</span>' +

  }
  function teacherHTML() {
    return '<div class="versus">' + scoreCard(0) + '<div class="vs">VS</div>' + scoreCard(1) + '</div>' + rulebar() + stageHTML() + binsHTML(0);
  }
  function panelHTML(t) {
    var n = S.names.groups;
    var inner = '<div class="panel-head"><span class="emoji" aria-hidden="true">' + EMOJI.groups[t] + '</span>' +
      '<span class="pname">' + esc(n[t]) + '</span><span class="pts">' + S.score[t] + '</span></div>';
    if (S.eff === 'tiles') {
      var w = selWord(t);
      inner += '<p class="hint">' + (w ? '„' + esc(w.w) + '“ → jetzt eine Spalte antippen!' : 'Tippt ein Wort an.') + '</p>' + poolHTML(t);
    }
    inner += binsHTML(t);
    if (S.frozen[t]) inner += '<div class="freeze">🧊 Falsch! Kurze Pause …</div>';
    return '<section class="panel p' + t + (S.fx.bump === t ? ' bump' : '') + (S.fx.shakePanel === t ? ' shakep' : '') + '" aria-label="' + esc(n[t]) + '">' + inner + '</section>';
  }
  function igCardHTML(t) {
    var G = S.G[t], cur = G.words[G.idx];
    var known = G.phase === 2 || !!G.res;
    var pop = S.fx.pop === t ? ' pop' : '';
    var row1 = '<span class="ipc-emo" aria-hidden="true">' + cur.e + '</span>' +
      (known ? '<span class="pl-art ' + cur.a + pop + '">' + cur.a + '</span>' : '<span class="ph" aria-hidden="true">?</span>') + ' ' + esc(cur.w);
    var row2;
    if (!known) row2 = '<span class="pl-q">erst Schritt 1 …</span>';
    else if (G.res) row2 = '<span class="pl-text ipc-text"><span class="pl-art ' + cur.a + pop + '">' + cur.ind + '</span> ' + esc(cur.w) + '</span>';
    else row2 = '<span class="pl-text ipc-text"><span class="ph" aria-hidden="true">?</span> ' + esc(cur.w) + '</span>';
    return '<div class="ipc' + (S.fx.enter === t ? ' enter' : '') + '">' +
      '<div class="ipc-row"><span class="pl-tag">Bestimmter Artikel</span><span class="pl-text ipc-text">' + row1 + '</span></div>' +
      '<div class="ipc-row ind' + (known ? '' : ' dim') + '"><span class="pl-tag">Unbestimmter Artikel</span>' + row2 + '</div></div>';
  }
  function igFeedbackHTML(t) {
    var G = S.G[t], cur = G.words[G.idx], txt, cls = '';
    var full = '„' + cur.a + ' ' + esc(cur.w) + '“ → „' + cur.ind + ' ' + esc(cur.w) + '“';
    if (!G.res) {
      if (G.phase === 1) txt = 'Schritt 1: Welcher Artikel? der, die oder das?';
      else { cls = ' ok'; txt = '✅ „' + cur.a + ' ' + esc(cur.w) + '“ stimmt! Schritt 2: ein oder eine?'; }
      return '<div class="feedback"><p class="fb-text' + cls + '">' + txt + '</p></div>';
    }
    if (G.res.ok) return '<div class="feedback"><p class="fb-text ok">🎉 Richtig! ' + full + ' (+1)</p></div>';
    var last = G.idx >= G.words.length - 1;
    return '<div class="feedback"><p class="fb-text bad">❌ Es heißt ' + full + '.</p>' +
      '<button type="button" class="btn gold" data-act="gnext" data-team="' + t + '">' + (last ? 'Fertig ✔' : 'Weiter ▶') + '</button></div>';
  }
  function igBinsHTML(t) {
    var G = S.G[t], cur = G.words[G.idx], html = '<div class="bins">';
    ARTS.forEach(function (a) {
      var cls = 'bin', dis = false;
      if (G.res) {
        dis = true; cls += a === cur.a ? ' reveal' : ' dim';
        if (G.pick === a && a !== cur.a) cls += ' wrongpick';
      }
      html += '<button type="button" class="' + cls + '" data-act="gbin" data-team="' + t + '" data-art="' + a + '"' + (dis ? ' disabled' : '') + '>' +
        '<span class="bin-label">' + a + '</span></button>';
    });
    return html + '</div>';
  }
  function igOptsHTML(t) {
    var G = S.G[t], cur = G.words[G.idx], html = '<div class="pl-opts two">';
    cur.opts.forEach(function (o) {
      var cls = 'pl-opt', dis = false;
      if (G.res) {
        dis = true; cls += o === cur.ind ? ' reveal' : ' dim';
        if (G.pick === o && o !== cur.ind) cls += ' wrongpick';
      }
      html += '<button type="button" class="' + cls + '" data-act="gbin" data-team="' + t + '" data-art="' + esc(o) + '"' + (dis ? ' disabled' : '') + '>' + esc(o) + '</button>';
    });
    return html + '</div>';
  }
  function igPanelHTML(t) {
    var G = S.G[t], n = S.names.groups;
    var inner = '<div class="panel-head"><span class="emoji" aria-hidden="true">' + EMOJI.groups[t] + '</span>' +
      '<span class="pname">' + esc(n[t]) + '</span><span class="pts">' + S.score[t] + '</span></div>';
    if (G.done) {
      inner += '<div class="pool empty">🏁 Fertig! Gleich geht es weiter, wenn die andere Gruppe fertig ist.</div>';
    } else {
      var shown = G.res ? (G.res.step === 1 ? 1 : 2) : G.phase;
      inner += igCardHTML(t) + igFeedbackHTML(t) + (shown === 1 ? igBinsHTML(t) : igOptsHTML(t));
    }
    return '<section class="panel p' + t + (S.fx.bump === t ? ' bump' : '') + (S.fx.shakePanel === t ? ' shakep' : '') + '" aria-label="' + esc(n[t]) + '">' + inner + '</section>';
  }
  function indefGroupsHTML() {
    return '<p class="rulebar">💡 Merke: <b>der</b> und <b>das</b> werden zu „ein“, <b>die</b> wird zu „eine“</p>' +
      '<div class="split indef">' + igPanelHTML(0) + igPanelHTML(1) + '</div>';
  }
  function groupsHTML() {
    if (S.topic === 'indef') return indefGroupsHTML();
    return rulebar() + '<div class="split">' + (S.eff === 'single' ? stageHTML() : '') + panelHTML(0) + panelHTML(1) + '</div>';
  }
  function progressText() {
    if (S.topic === 'indef' && S.mode === 'groups' && S.G) {
      var gn = S.names.groups;
      return gn[0] + ' ' + (S.G[0].done ? S.G[0].words.length : S.G[0].idx) + '/' + S.G[0].words.length + ' · ' +
        gn[1] + ' ' + (S.G[1].done ? S.G[1].words.length : S.G[1].idx) + '/' + S.G[1].words.length;
    }
    if (S.eff === 'single') return 'Wort ' + Math.min(S.idx + 1, S.words.length) + ' von ' + S.words.length;
    return (S.words.length - S.pool.length) + ' von ' + S.words.length + ' sortiert';
  }
  function render() {
    var b = $('board');
    b.className = 'board mode-' + S.mode + ' task-' + S.eff + ' n' + sizeKey();
    b.innerHTML = S.mode === 'teacher' ? teacherHTML() : groupsHTML();
    $('progress').textContent = progressText();
    $('btnSound').textContent = S.sound ? '🔊' : '🔇';
    S.fx = {};
  }

  /* ---------- Spielablauf ---------- */
  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

  function newGame() {
    clearTimers();
    $('endModal').hidden = true;
    S.eff = twoStep() ? 'single' : S.task;
    var cnt = useCount();
    var set = S.topic === 'plural' ? buildPluralSet(cnt) : S.topic === 'indef' ? buildIndefSet(cnt) : buildWordSet(cnt);
    S.words = set; S.idx = 0; S.score = [0, 0]; S.picks = [null, null]; S.res = null; S.phase = 1;
    S.G = null;
    if (S.topic === 'indef' && S.mode === 'groups') {
      var set2 = buildIndefSet(cnt, set.map(function (x) { return x.w; }));
      S.G = [set, set2].map(function (ws) { return { words: ws, idx: 0, phase: 1, res: null, pick: null, done: false }; });
    }
    S.pool = set.slice(); S.sel = [null, null]; S.frozen = [false, false];
    S.bins = [{ der: [], die: [], das: [] }, { der: [], die: [], das: [] }];
    S.over = false; S.fx = { enter: true };
    $('menu').hidden = true; $('game').hidden = false;
    window.scrollTo(0, 0);
    render();
  }
  function toMenu() {
    clearTimers();
    $('endModal').hidden = true;
    $('game').hidden = true; $('menu').hidden = false;
    syncMenu();
    window.scrollTo(0, 0);
  }

  function answerSingle(t, art) {
    if (S.res || S.over) return;
    var cur = S.words[S.idx];
    if (twoStep() && S.phase === 1) {
      if (S.mode === 'teacher') {
        if (art === cur.a) {
          sound('ok'); S.phase = 2; S.picks = [null, null]; toast('✅ Richtig: ' + cur.a + ' ' + cur.w + '!', 'ok', 1500);
        } else {
          S.picks[0] = art; S.score[1]++; S.fx.bump = 1;
          S.res = { winner: 1, ok: false, step: 1 }; sound('bad');
        }
      } else {
        if (S.picks[t] !== null) return;
        if (art === cur.a) {
          sound('ok'); S.phase = 2; S.picks = [null, null]; S.fx.enter = false;
          toast('✅ ' + S.names.groups[t] + ' war zuerst richtig: ' + cur.a + ' ' + cur.w + '!', 'ok', 1800);
        } else {
          S.picks[t] = art; sound('bad');
          if (S.picks[0] !== null && S.picks[1] !== null) S.res = { winner: -1, ok: false, step: 1 };
        }
      }
      render();
      return;
    }
    var right = S.topic === 'plural' ? cur.p : S.topic === 'indef' ? cur.ind : cur.a;
    if (S.mode === 'teacher') {
      var ok = art === right;
      S.picks[0] = art;
      S.score[ok ? 0 : 1]++;
      S.fx.bump = ok ? 0 : 1;
      S.res = { winner: ok ? 0 : 1, ok: ok };
      sound(ok ? 'ok' : 'bad');
      if (ok) burst(36, 0.5, 0.4);
    } else {
      if (S.picks[t] !== null) return;
      if (art === right) {
        S.score[t]++; S.fx.bump = t;
        S.res = { winner: t, ok: true };
        sound('ok'); burst(36, t === 0 ? 0.25 : 0.75, 0.6);
      } else {
        S.picks[t] = art;
        sound('bad');
        if (S.picks[0] !== null && S.picks[1] !== null) S.res = { winner: -1, ok: false };
      }
    }
    render();
    if (S.res && S.res.ok) {
      var wi = S.idx;
      S.timers.push(setTimeout(function () {
        if (!S.over && S.res && S.res.ok && S.idx === wi) nextWord();
      }, 1600));
    }
  }
  function gAnswer(t, art) {
    var G = S.G && S.G[t];
    if (!G || S.over || G.done || G.res) return;
    var cur = G.words[G.idx];
    if (G.phase === 1) {
      if (art === cur.a) { G.phase = 2; G.pick = null; sound('ok'); }
      else { G.pick = art; G.res = { ok: false, step: 1 }; S.fx.shakePanel = t; S.fx.pop = t; sound('bad'); }
    } else if (art === cur.ind) {
      G.res = { ok: true, step: 2 }; S.score[t]++; S.fx.bump = t; S.fx.pop = t;
      sound('ok'); burst(30, t === 0 ? 0.25 : 0.75, 0.6);
    } else {
      G.pick = art; G.res = { ok: false, step: 2 }; S.fx.shakePanel = t; S.fx.pop = t; sound('bad');
    }
    render();
    if (G.res && G.res.ok) {
      var gi = G.idx;
      S.timers.push(setTimeout(function () {
        if (!S.over && !G.done && G.res && G.res.ok && G.idx === gi) gNext(t);
      }, 1500));
    }
  }
  function gNext(t) {
    var G = S.G && S.G[t];
    if (!G || S.over || G.done || !G.res) return;
    if (G.idx >= G.words.length - 1) {
      G.done = true;
      if (S.G[0].done && S.G[1].done) { finish(); return; }
      render();
      return;
    }
    G.idx++; G.phase = 1; G.res = null; G.pick = null; S.fx.enter = t;
    render();
  }
  function nextWord() {
    if (!S.res || S.over) return;
    if (S.idx >= S.words.length - 1) { finish(); return; }
    S.idx++; S.picks = [null, null]; S.res = null; S.fx.enter = true; S.phase = 1;
    render();
  }

  function selectTile(t, id) {
    if (S.over || S.frozen[t]) return;
    S.sel[t] = (S.sel[t] === id) ? null : id;
    sound('blip');
    render();
  }
  function removeFromPool(id) {
    S.pool = S.pool.filter(function (x) { return x.id !== id; });
  }
  function placeTile(t, art) {
    if (S.over || S.frozen[t]) return;
    var w = selWord(t);
    if (!w) { S.sel[t] = null; toast('👆 Tippe zuerst ein Wort an!', '', 1700); return; }
    var ok = w.a === art, n = S.names[S.mode];

    if (S.mode === 'teacher') {
      S.score[ok ? 0 : 1]++; S.fx.bump = ok ? 0 : 1;
      S.bins[0][w.a].push({ id: w.id, w: w.w, miss: !ok });
      removeFromPool(w.id); S.sel[0] = null; S.fx.newChip = w.id;
      if (!ok) S.fx.wrongBin = art;
      sound(ok ? 'ok' : 'bad');
      if (ok) burst(30, 0.5, 0.5);
      toast(ok ? '🎉 Richtig! Punkt für ' + n[0] : '❌ „' + w.w + '“ gehört zu „' + w.a + '“. Punkt für ' + n[1], ok ? 'ok' : 'bad');
    } else if (ok) {
      S.score[t]++; S.fx.bump = t;
      S.bins[t][art].push({ id: w.id, w: w.w, miss: false });
      removeFromPool(w.id); S.fx.newChip = w.id;
      if (S.sel[0] === w.id) S.sel[0] = null;
      if (S.sel[1] === w.id) S.sel[1] = null;
      sound('ok'); burst(30, t === 0 ? 0.25 : 0.75, 0.6);
      toast('🎉 ' + n[t] + ': „' + w.a + ' ' + w.w + '“ – Punkt!', 'ok');
    } else {
      S.sel[t] = null; S.frozen[t] = true; S.fx.shakePanel = t;
      sound('bad');
      toast('❌ ' + n[t] + ': Das war falsch – kurze Pause!', 'bad');
      S.timers.push(setTimeout(function () { S.frozen[t] = false; if (!S.over) render(); }, 2000));
    }
    if (!S.pool.length) { finish(); } else { render(); }
  }

  function finish() {
    S.over = true;
    render();
    var n = S.names[S.mode], a = S.score[0], b = S.score[1];
    var emoji, title, sub;
    if (a === b) {
      emoji = '🤝'; title = 'Unentschieden!'; sub = 'Genau gleich stark – tolle Runde!';
    } else {
      var w = a > b ? 0 : 1;
      title = n[w] + ' gewinnt!';
      if (S.mode === 'teacher') {
        emoji = w === 0 ? '🏆' : '🍎';
        sub = w === 0 ? 'Super gemacht – ihr habt gewonnen! 🎉' : 'Knapp daneben – beim nächsten Mal klappt es bestimmt!';
      } else {
        emoji = '🏆'; sub = 'Beide Gruppen haben toll mitgemacht!';
      }
    }
    $('endEmoji').textContent = emoji;
    $('endTitle').textContent = title;
    $('endSub').textContent = sub;
    $('endScore').innerHTML =
      '<span class="fs" style="background:var(--t0)">' + esc(n[0]) + ' ' + a + '</span><span>:</span>' +
      '<span class="fs" style="background:var(--t1)">' + esc(n[1]) + ' ' + b + '</span>';
    $('endModal').hidden = false;
    sound('win');
    if (!(S.mode === 'teacher' && b > a)) rain();
  }

  /* ---------- Bedienung ---------- */
  $('board').addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    ensureAudio();
    var act = el.dataset.act, t = parseInt(el.dataset.team || '0', 10);
    if (act === 'bin') {
      if (S.eff === 'single') answerSingle(t, el.dataset.art); else placeTile(t, el.dataset.art);
    } else if (act === 'tile') {
      selectTile(t, parseInt(el.dataset.id, 10));
    } else if (act === 'gbin') {
      gAnswer(t, el.dataset.art);
    } else if (act === 'gnext') {
      gNext(t);
    } else if (act === 'next') {
      nextWord();
    }
  });

  document.addEventListener('keydown', function (e) {
    if ($('game').hidden || S.over || S.eff !== 'single' || !S.res) return;
    if ((e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') && !(e.target && e.target.tagName === 'BUTTON')) {
      e.preventDefault();
      nextWord();
    }
  });

  qsa('[data-topic]').forEach(function (b) {
    b.addEventListener('click', function () { S.topic = b.dataset.topic; save(); syncMenu(); });
  });
  qsa('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { S.mode = b.dataset.mode; save(); syncMenu(); });
  });
  qsa('[data-task]').forEach(function (b) {
    b.addEventListener('click', function () { S.task = b.dataset.task; save(); syncMenu(); });
  });
  qsa('[data-count]').forEach(function (b) {
    b.addEventListener('click', function () { S.count = parseInt(b.dataset.count, 10); save(); syncMenu(); });
  });
  ['name0', 'name1'].forEach(function (id, i) {
    $(id).addEventListener('input', function () {
      S.names[S.mode][i] = this.value.slice(0, 16);
      save(); ruleText();
    });
  });

  $('countInput').addEventListener('input', function () {
    var v = parseInt(this.value, 10);
    if (isNaN(v) || v < 1) return;
    S.count = Math.min(v, 100); save(); syncMenu();
  });
  $('countInput').addEventListener('change', function () {
    var v = parseInt(this.value, 10);
    if (!isNaN(v)) S.count = Math.max(1, Math.min(v, 100));
    this.value = String(S.count);
    save(); syncMenu();
  });

  $('btnStart').addEventListener('click', function () {
    ['teacher', 'groups'].forEach(function (m) {
      S.names[m] = S.names[m].map(function (nm, i) { return nm.trim() || DEFAULT_NAMES[m][i]; });
    });
    save(); ensureAudio(); newGame();
  });
  $('btnAgain').addEventListener('click', newGame);
  $('btnMenuEnd').addEventListener('click', toMenu);
  $('btnSound').addEventListener('click', function () {
    S.sound = !S.sound; save();
    this.textContent = S.sound ? '🔊' : '🔇';
    if (S.sound) sound('blip');
  });

  // Zweimal tippen nötig, damit im Klassenzimmer nichts versehentlich verloren geht
  function armed(btn, action) {
    var orig = btn.textContent, timer = null;
    btn.addEventListener('click', function () {
      if (btn.classList.contains('armed')) {
        clearTimeout(timer);
        btn.classList.remove('armed'); btn.textContent = orig;
        action();
      } else {
        btn.classList.add('armed'); btn.textContent = 'Sicher?';
        timer = setTimeout(function () { btn.classList.remove('armed'); btn.textContent = orig; }, 3000);
      }
    });
  }
  armed($('btnRestart'), newGame);
  armed($('btnMenu'), toMenu);

  function resetPool() {
    delete pools[S.topic];
    savePools(); syncMenu();
  }
  armed($('btnPoolReset'), resetPool);

  loadPools();
  load();
  syncMenu();
})();
</script>
</body>
</html>
