<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Artikel-Sortierer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECE2CC;
    --bg-card: #F8F2E2;
    --bg-card-2: #F1E7CE;
    --ink: #23293A;
    --ink-soft: rgba(35,41,58,0.68);
    --accent-red: #9E3226;
    --accent-red-ink: #FBEBE7;
    --accent-blue: #3E5C86;
    --accent-blue-ink: #EAF0F7;
    --accent-gold: #A9791E;
    --accent-green: #34633F;
    --accent-green-ink: #E9F3EA;
    --border: #C9B98A;
    --card-shadow: rgba(60,45,15,0.22);
    font-family: 'Baloo 2', 'Segoe UI', sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #12151C;
      --bg-card: #1E2431;
      --bg-card-2: #232A39;
      --ink: #F1E9D8;
      --ink-soft: rgba(241,233,216,0.68);
      --accent-red: #DE6A57;
      --accent-red-ink: #3A211D;
      --accent-blue: #7EA6D8;
      --accent-blue-ink: #1B2A3A;
      --accent-gold: #E4B94F;
      --accent-green: #7FCB96;
      --accent-green-ink: #1B3323;
      --border: #3B4356;
      --card-shadow: rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151C;
    --bg-card: #1E2431;
    --bg-card-2: #232A39;
    --ink: #F1E9D8;
    --ink-soft: rgba(241,233,216,0.68);
    --accent-red: #DE6A57;
    --accent-red-ink: #3A211D;
    --accent-blue: #7EA6D8;
    --accent-blue-ink: #1B2A3A;
    --accent-gold: #E4B94F;
    --accent-green: #7FCB96;
    --accent-green-ink: #1B3323;
    --border: #3B4356;
    --card-shadow: rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    min-height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background-image:
      radial-gradient(circle at 18% 22%, rgba(169,121,30,0.07) 0, transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(62,92,134,0.06) 0, transparent 45%);
    overflow-x: hidden;
  }

  .app { max-width: 680px; margin: 0 auto; padding: 28px 18px 40px; }

  header { text-align: center; margin-bottom: 18px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 0.8rem; letter-spacing: 0.04em; color: var(--ink-soft);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 14px; margin-bottom: 10px;
  }
  h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: clamp(1.5rem, 6vw, 2.1rem);
    margin: 0 0 8px; line-height: 1.25;
  }
  .subtitle { font-size: 1.05rem; color: var(--ink-soft); margin: 0; max-width: 46ch; margin-inline: auto; }
  .class-tag { font-size: 0.85rem; color: var(--accent-gold); font-weight: 700; margin: 10px 0 0; }

  .progress-line {
    text-align: center; font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 18px;
  }

  .pool {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px;
    padding: 18px; margin-bottom: 20px; min-height: 72px;
  }

  .tile {
    touch-action: none;
    background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 18px; font-family: 'Baloo 2', 'Segoe UI', sans-serif; font-weight: 700;
    font-size: clamp(1rem, 4vw, 1.15rem); color: var(--ink); cursor: grab;
    box-shadow: 0 4px 0 var(--card-shadow); user-select: none; -webkit-tap-highlight-color: transparent;
    transition: box-shadow 0.15s, transform 0.15s, background 0.2s, border-color 0.2s;
  }
  .tile:active { cursor: grabbing; }
  .tile.selected { background: var(--bg-card); border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(169,121,30,0.35); transform: translateY(-2px); }
  .tile.placeholder { visibility: hidden; }
  .tile:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 2px; }
  .tile.shake { animation: shake 0.4s; border-color: var(--accent-red); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .ghost { box-shadow: 0 10px 18px rgba(0,0,0,0.28); transform: scale(1.05); opacity: 0.96; }

  .baskets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .basket {
    background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px;
    padding: 12px 10px 14px; min-height: 150px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .basket:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 2px; }
  .basket.hover { transform: scale(1.02); }
  .basket[data-article="der"] { border-color: var(--accent-blue); }
  .basket[data-article="der"].hover { background: color-mix(in srgb, var(--accent-blue) 14%, var(--bg-card)); }
  .basket[data-article="die"] { border-color: var(--accent-red); }
  .basket[data-article="die"].hover { background: color-mix(in srgb, var(--accent-red) 14%, var(--bg-card)); }
  .basket[data-article="das"] { border-color: var(--accent-green); }
  .basket[data-article="das"].hover { background: color-mix(in srgb, var(--accent-green) 14%, var(--bg-card)); }

  .basket-label {
    text-align: center; font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 1.1rem; font-weight: 400; margin-bottom: 8px;
  }
  .basket[data-article="der"] .basket-label { color: var(--accent-blue); }
  .basket[data-article="die"] .basket-label { color: var(--accent-red); }
  .basket[data-article="das"] .basket-label { color: var(--accent-green); }

  .basket-slot { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chip {
    background: var(--bg-card-2); border: 1px solid currentColor; border-radius: 999px;
    padding: 5px 11px; font-size: 0.85rem; font-weight: 600;
  }
  .basket[data-article="der"] .chip { color: var(--accent-blue); }
  .basket[data-article="die"] .chip { color: var(--accent-red); }
  .basket[data-article="das"] .chip { color: var(--accent-green); }

  .status {
    min-height: 26px; text-align: center; font-size: 0.92rem; color: var(--ink-soft); margin-bottom: 6px;
  }

  .end-screen {
    text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 22px; margin-top: 12px;
  }
  .end-screen .stamp-big { font-size: 2.6rem; margin-bottom: 6px; }
  .end-screen h2 { font-family: 'Special Elite', 'Courier New', monospace; font-size: 1.4rem; margin: 0 0 6px; }
  .end-screen p { font-size: 1.05rem; margin-bottom: 20px; color: var(--ink-soft); }
  .restart-btn {
    padding: 13px 26px; font-family: 'Baloo 2', 'Segoe UI', sans-serif; font-weight: 700; font-size: 1rem;
    color: #fff; background: var(--accent-gold); border: none; border-radius: 10px; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  }
  .restart-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .restart-btn:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 2px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="badge">📦 Sortier-Auftrag</span>
    <h1>Der Artikel-Sortierer</h1>
    <p class="subtitle">Zieht jedes Wort in die richtige Kiste: der, die oder das. (Oder tippt das Wort an und dann die Kiste.)</p>
    <p class="class-tag">Klasse 2 · Grundschule Böhlitz-Ehrenberg</p>
  </header>

  <p class="progress-line" id="progressLine">0 von 15 einsortiert</p>

  <div id="pool" class="pool"></div>

  <div class="baskets">
    <div class="basket" data-article="der" tabindex="0" role="button" aria-label="Kiste der">
      <div class="basket-label">der</div>
      <div class="basket-slot" id="slot-der"></div>
    </div>
    <div class="basket" data-article="die" tabindex="0" role="button" aria-label="Kiste die">
      <div class="basket-label">die</div>
      <div class="basket-slot" id="slot-die"></div>
    </div>
    <div class="basket" data-article="das" tabindex="0" role="button" aria-label="Kiste das">
      <div class="basket-label">das</div>
      <div class="basket-slot" id="slot-das"></div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="end-screen" id="endScreen" hidden>
    <div class="stamp-big">🎉</div>
    <h2>Alle Wörter einsortiert!</h2>
    <p id="endText"></p>
    <button class="restart-btn" id="restartBtn">Neu mischen</button>
  </div>
</div>

<script>
(function () {
  var WORDS = [
    {w:'Baum', a:'der'}, {w:'Hund', a:'der'}, {w:'Tisch', a:'der'}, {w:'Apfel', a:'der'}, {w:'Mond', a:'der'},
    {w:'Blume', a:'die'}, {w:'Katze', a:'die'}, {w:'Schule', a:'die'}, {w:'Lampe', a:'die'}, {w:'Sonne', a:'die'},
    {w:'Haus', a:'das'}, {w:'Buch', a:'das'}, {w:'Kind', a:'das'}, {w:'Auto', a:'das'}, {w:'Fenster', a:'das'}
  ];

  var pool = document.getElementById('pool');
  var statusEl = document.getElementById('status');
  var progressLine = document.getElementById('progressLine');
  var endScreen = document.getElementById('endScreen');
  var endText = document.getElementById('endText');

  var total = WORDS.length;
  var solved = 0;
  var mistakes = 0;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function setStatus(text) { statusEl.textContent = text || ''; }
  function updateProgress() { progressLine.textContent = solved + ' von ' + total + ' einsortiert'; }

  function clearSelection() {
    document.querySelectorAll('.tile.selected').forEach(function (t) { t.classList.remove('selected'); });
  }

  function getBasketAt(x, y) {
    var baskets = document.querySelectorAll('.basket');
    for (var i = 0; i < baskets.length; i++) {
      var r = baskets[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return baskets[i];
    }
    return null;
  }

  function placeInBasket(tile, article) {
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = tile.dataset.word;
    document.getElementById('slot-' + article).appendChild(chip);
    tile.remove();
    solved++;
    updateProgress();
    setStatus('Richtig! „' + article + ' ' + tile.dataset.word + '“ gehört in diese Kiste.');
    if (solved === total) finish();
  }

  function shakeTile(tile) {
    tile.classList.add('shake');
    setTimeout(function () { tile.classList.remove('shake'); }, 400);
  }

  function handleDrop(tile, article) {
    clearSelection();
    var correct = tile.dataset.article === article;
    if (correct) {
      placeInBasket(tile, article);
    } else {
      shakeTile(tile);
      mistakes++;
      setStatus('„' + tile.dataset.word + '“ gehört nicht in die Kiste „' + article + '“. Versucht es noch einmal!');
    }
  }

  function finish() {
    endScreen.hidden = false;
    endText.textContent = mistakes === 0
      ? 'Alle 15 Wörter auf Anhieb richtig einsortiert – stark!'
      : 'Ihr habt alle 15 Wörter einsortiert (' + mistakes + (mistakes === 1 ? ' Fehlversuch' : ' Fehlversuche') + ').';
    setStatus('');
  }

  function createTile(item) {
    var tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.textContent = item.w;
    tile.dataset.word = item.w;
    tile.dataset.article = item.a;
    tile.dataset.justDragged = '0';

    tile.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      var rect = tile.getBoundingClientRect();
      var startX = e.clientX, startY = e.clientY;
      var offsetX = startX - rect.left, offsetY = startY - rect.top;
      var moved = false;
      var ghost = null;

      function createGhost() {
        ghost = document.createElement('div');
        ghost.className = 'tile ghost';
        ghost.textContent = tile.dataset.word;
        ghost.style.position = 'fixed';
        ghost.style.left = rect.left + 'px';
        ghost.style.top = rect.top + 'px';
        ghost.style.width = rect.width + 'px';
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '999';
        document.body.appendChild(ghost);
        tile.classList.add('placeholder');
      }

      function onMove(ev) {
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
          moved = true;
          createGhost();
        }
        if (moved && ghost) {
          ghost.style.left = (ev.clientX - offsetX) + 'px';
          ghost.style.top = (ev.clientY - offsetY) + 'px';
          var basket = getBasketAt(ev.clientX, ev.clientY);
          document.querySelectorAll('.basket').forEach(function (b) { b.classList.toggle('hover', b === basket); });
        }
      }

      function onUp(ev) {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.querySelectorAll('.basket').forEach(function (b) { b.classList.remove('hover'); });

        if (!moved) return;

        tile.dataset.justDragged = '1';
        var basket = getBasketAt(ev.clientX, ev.clientY);
        if (ghost) ghost.remove();
        tile.classList.remove('placeholder');
        if (basket) handleDrop(tile, basket.dataset.article);
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });

    tile.addEventListener('click', function () {
      if (tile.dataset.justDragged === '1') { tile.dataset.justDragged = '0'; return; }
      var already = tile.classList.contains('selected');
      clearSelection();
      if (!already) tile.classList.add('selected');
    });

    return tile;
  }

  function setup() {
    solved = 0;
    mistakes = 0;
    endScreen.hidden = true;
    pool.innerHTML = '';
    ['der', 'die', 'das'].forEach(function (a) { document.getElementById('slot-' + a).innerHTML = ''; });
    updateProgress();
    setStatus('');
    shuffle(WORDS).forEach(function (item) { pool.appendChild(createTile(item)); });
  }

  document.querySelectorAll('.basket').forEach(function (basket) {
    basket.addEventListener('click', function () {
      var sel = document.querySelector('.tile.selected');
      if (sel) handleDrop(sel, basket.dataset.article);
    });
    basket.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        var sel = document.querySelector('.tile.selected');
        if (sel) handleDrop(sel, basket.dataset.article);
      }
    });
  });

  document.getElementById('restartBtn').addEventListener('click', setup);

  setup();
})();
</script>
</body>
</html>
