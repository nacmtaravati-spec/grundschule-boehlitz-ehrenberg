<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚦 Ampel-Feedback</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rot:#ff5a5a;   --rot-d:#e02f2f;
  --gelb:#ffcf33;  --gelb-d:#f0a500;
  --gruen:#33d17a; --gruen-d:#1fa85f;
  --ink:#2a2350;
}
body{
  font-family:'Nunito',sans-serif;color:var(--ink);
  min-height:100vh;overflow-x:hidden;position:relative;
  background:linear-gradient(130deg,#7ae7ff 0%,#8fd3ff 22%,#c9a7ff 48%,#ffb3d9 72%,#ffd58f 100%);
  background-size:280% 280%;animation:bgShift 22s ease infinite;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* floating candy blobs */
.blob{position:fixed;border-radius:50%;filter:blur(6px);opacity:.5;z-index:0;pointer-events:none;animation:float 9s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.08)}}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:14px 16px 60px;}

/* Header */
.hdr{text-align:center;padding:8px 0 6px;}
.hdr h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(2.1rem,6vw,3.6rem);
  color:#fff;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 26px rgba(0,0,0,.18);}
.hdr p{font-family:'Fredoka',sans-serif;font-weight:500;color:#fff;font-size:1rem;
  text-shadow:0 2px 6px rgba(0,0,0,.18);margin-top:2px;}

.lernziel{display:inline-block;max-width:100%;margin:10px auto 8px;padding:12px 22px;border-radius:22px;background:rgba(255,255,255,.93);
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(1.15rem,3.6vw,1.6rem);color:var(--ink);
  box-shadow:0 8px 22px rgba(60,40,100,.2);line-height:1.35;}
.lernziel .lz-lab{display:block;font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#8b3ff5;margin-bottom:2px;}

/* Count row */
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 16px;}
.cnt{border-radius:22px;padding:14px 8px 12px;text-align:center;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.18),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .25s;}
.cnt.bump{animation:bump .5s cubic-bezier(.18,.9,.3,1.4);}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.cnt-r{background:linear-gradient(160deg,var(--rot),var(--rot-d));}
.cnt-y{background:linear-gradient(160deg,var(--gelb),var(--gelb-d));}
.cnt-g{background:linear-gradient(160deg,var(--gruen),var(--gruen-d));}
.cnt .dot{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.85);margin:0 auto 4px;box-shadow:0 0 12px rgba(255,255,255,.7);}
.cnt .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.4rem;line-height:1;}
.cnt .lab{font-weight:800;font-size:.82rem;opacity:.95;margin-top:2px;letter-spacing:.5px;}

/* Cards */
.card{background:rgba(255,255,255,.92);border-radius:26px;padding:18px 16px;margin-bottom:16px;
  box-shadow:0 14px 34px rgba(60,40,100,.18);}
.card-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.3rem;text-align:center;color:var(--ink);margin-bottom:12px;}

/* Traffic light */
.tl-hint{text-align:center;font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.15rem;color:var(--ink);margin-bottom:10px;min-height:1.4rem;}
.tl-stage{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;}
.tl-house{background:linear-gradient(160deg,#3a3358,#26213e);border-radius:34px;padding:20px 18px;
  display:flex;flex-direction:column;gap:16px;box-shadow:0 16px 36px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.08);}
.light{width:96px;height:96px;border-radius:50%;cursor:pointer;position:relative;border:none;
  transition:transform .16s,box-shadow .25s,filter .25s;filter:saturate(.5) brightness(.5);}
.light::after{content:'';position:absolute;top:14%;left:20%;width:34%;height:26%;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);}
.light.red{background:radial-gradient(circle at 38% 32%,#ff9a9a,var(--rot) 55%,var(--rot-d));}
.light.yellow{background:radial-gradient(circle at 38% 32%,#ffe58a,var(--gelb) 55%,var(--gelb-d));}
.light.green{background:radial-gradient(circle at 38% 32%,#9af2c0,var(--gruen) 55%,var(--gruen-d));}
.tl-live .light{filter:saturate(1) brightness(1);animation:glowpulse 1.6s ease-in-out infinite;}
.tl-live .light:hover{transform:scale(1.08);}
.tl-live .light.red{box-shadow:0 0 30px var(--rot);}
.tl-live .light.yellow{box-shadow:0 0 30px var(--gelb);}
.tl-live .light.green{box-shadow:0 0 30px var(--gruen);}
@keyframes glowpulse{0%,100%{filter:saturate(1) brightness(1)}50%{filter:saturate(1) brightness(1.18)}}
.light.picked{transform:scale(1.16);animation:pickpop .5s;}
@keyframes pickpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1.16)}}

.tl-legend{display:flex;flex-direction:column;gap:16px;}
.leg{display:flex;align-items:center;gap:12px;}
.leg .lg-dot{width:34px;height:34px;border-radius:50%;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.2);}
.leg-r .lg-dot{background:linear-gradient(160deg,var(--rot),var(--rot-d));}
.leg-y .lg-dot{background:linear-gradient(160deg,var(--gelb),var(--gelb-d));}
.leg-g .lg-dot{background:linear-gradient(160deg,var(--gruen),var(--gruen-d));}
.leg .lg-txt b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;display:block;color:var(--ink);}
.leg .lg-txt span{font-weight:700;font-size:.85rem;color:#6b6390;}

/* Footer */
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(40,25,70,.55);backdrop-filter:blur(6px);
  z-index:60;display:none;place-items:center;padding:16px;}
.overlay.show{display:grid;}
.modal{background:#fff;border-radius:30px;padding:26px 24px;text-align:center;max-width:460px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .4s cubic-bezier(.18,.9,.3,1.35);max-height:92vh;overflow-y:auto;}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.m-em{font-size:3.6rem;display:block;margin-bottom:6px;}
.m-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.9rem;margin-bottom:6px;color:var(--ink);}
.m-sub{font-weight:700;font-size:1.05rem;color:#5c5480;margin-bottom:18px;line-height:1.5;}
.m-ok{background:linear-gradient(160deg,#33d17a,#1fa85f);color:#fff;border:none;padding:13px 34px;border-radius:50px;
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .16s;}
.m-ok:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.14);}

/* result bars */
.res-bars{margin:6px 0 4px;text-align:left;}
.res-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.res-lbl{width:74px;font-family:'Fredoka';font-weight:600;font-size:1rem;flex-shrink:0;display:flex;align-items:center;gap:7px;}
.res-lbl .rd{width:18px;height:18px;border-radius:50%;}
.res-bg{flex:1;height:26px;background:#eee7f7;border-radius:14px;overflow:hidden;}
.res-fill{height:100%;border-radius:14px;transition:width .8s cubic-bezier(.2,.8,.3,1);min-width:3px;}
.res-val{width:30px;text-align:right;font-family:'Fredoka';font-weight:700;font-size:1.15rem;flex-shrink:0;}

/* confetti + toast */
.cf{position:fixed;border-radius:2px;animation:cfDrop linear forwards;pointer-events:none;z-index:80;}
@keyframes cfDrop{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#fff;color:var(--ink);padding:12px 24px;border-radius:50px;font-family:'Fredoka';font-weight:600;font-size:1rem;
  z-index:70;transition:transform .3s;box-shadow:0 10px 28px rgba(0,0,0,.22);max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:560px){
  .counts{gap:8px;}
  .cnt .num{font-size:2rem;}
  .light{width:82px;height:82px;}
  .tl-stage{gap:14px;}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="hdr">
    <h1>🚦 Unsere Feedback-Ampel</h1>
    <div class="lernziel"><span class="lz-lab">🎯 Lernziel</span>Ich kann offene und geschlossene Silben unterscheiden.</div>
    <p>Wie gut hast du es heute verstanden?</p>
  </div>

  <!-- live counts -->
  <div class="counts">
    <div class="cnt cnt-r" id="cntR"><div class="dot"></div><div class="num" id="numR">0</div><div class="lab">ROT</div></div>
    <div class="cnt cnt-y" id="cntY"><div class="dot"></div><div class="num" id="numY">0</div><div class="lab">GELB</div></div>
    <div class="cnt cnt-g" id="cntG"><div class="dot"></div><div class="num" id="numG">0</div><div class="lab">GRÜN</div></div>
  </div>

  <!-- traffic light -->
  <div class="card">
    <div class="tl-hint" id="tlHint">Tippe auf deine Farbe! 🚦</div>
    <div class="tl-stage">
      <div class="tl-house tl-live" id="tlHouse">
        <button class="light red"    id="lightR" onclick="vote('r')"></button>
        <button class="light yellow" id="lightY" onclick="vote('y')"></button>
        <button class="light green"  id="lightG" onclick="vote('g')"></button>
      </div>
      <div class="tl-legend">
        <div class="leg leg-r"><span class="lg-dot"></span><span class="lg-txt"><b>Hilfe!</b><span>Ich brauche noch Hilfe</span></span></div>
        <div class="leg leg-y"><span class="lg-dot"></span><span class="lg-txt"><b>Fast!</b><span>Ich übe noch etwas</span></span></div>
        <div class="leg leg-g"><span class="lg-dot"></span><span class="lg-txt"><b>Alles klar!</b><span>Ich hab's verstanden</span></span></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="btn b-end" onclick="showResult()">🏁 Ende &amp; Auswertung</button>
    <button class="btn b-reset" onclick="resetAll()">🔄 Neu starten</button>
  </div>

</div>

<!-- result -->
<div class="overlay" id="rOverlay">
  <div class="modal">
    <span class="m-em" id="resEm">🏁</span>
    <div class="m-title" id="resTitle">Unsere Auswertung</div>
    <div class="m-sub" id="resMsg"></div>
    <div class="res-bars" id="resBars"></div>
    <button class="m-ok" style="margin-top:14px;" onclick="closeResult()">Schließen</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let counts={r:0,y:0,g:0};

/* ── colourful background blobs ── */
(function(){
  const cols=['#ff8ac0','#8be0ff','#ffd36b','#b69bff','#8ff0c0','#ff9f6b'];
  for(let i=0;i<7;i++){const b=document.createElement('div');b.className='blob';
    const s=120+Math.random()*180;
    b.style.cssText=`width:${s}px;height:${s}px;background:${cols[i%cols.length]};top:${Math.random()*90}%;left:${Math.random()*90}%;animation-delay:${Math.random()*6}s;animation-duration:${7+Math.random()*6}s`;
    document.body.appendChild(b);}
})();

/* ── VOTE ── */
const MEAN={r:{em:'🤗',t:'Alles gut!',s:'Wir üben zusammen weiter — das schaffst du!'},
            y:{em:'💪',t:'Fast geschafft!',s:'Mit ein bisschen Übung klappt das super!'},
            g:{em:'🎉',t:'Super gemacht!',s:'Klasse, dass du es verstanden hast!'}};
const CNT={r:'cntR',y:'cntY',g:'cntG'};
const LIGHT={r:'lightR',y:'lightY',g:'lightG'};
const CFCOL={r:['#ff5a5a','#ff9a9a','#ffd36b'],y:['#ffcf33','#ffe58a','#ff9f6b'],g:['#33d17a','#9af2c0','#8be0ff']};

let hintT;
function vote(k){
  counts[k]++;
  document.getElementById('num'+k.toUpperCase()).textContent=counts[k];
  // bump the count card
  const c=document.getElementById(CNT[k]);c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
  // pop the light
  const lg=document.getElementById(LIGHT[k]);
  lg.classList.remove('picked');void lg.offsetWidth;lg.classList.add('picked');
  confetti(CFCOL[k]);
  const m=MEAN[k];
  document.getElementById('tlHint').innerHTML=`${m.em} <b style="font-family:Fredoka">${m.t}</b> ${m.s}`;
  clearTimeout(hintT);
  hintT=setTimeout(()=>{
    lg.classList.remove('picked');
    document.getElementById('tlHint').textContent='Tippe auf deine Farbe! 🚦';
  },1700);
}

/* ── RESULT ── */
function showResult(){
  const total=counts.r+counts.y+counts.g;
  const bars=[
    {k:'r',lbl:'Rot',col:'linear-gradient(90deg,#ff9a9a,#e02f2f)',dot:'#ff5a5a',v:counts.r},
    {k:'y',lbl:'Gelb',col:'linear-gradient(90deg,#ffe58a,#f0a500)',dot:'#ffcf33',v:counts.y},
    {k:'g',lbl:'Grün',col:'linear-gradient(90deg,#9af2c0,#1fa85f)',dot:'#33d17a',v:counts.g},
  ];
  const max=Math.max(1,counts.r,counts.y,counts.g);
  document.getElementById('resBars').innerHTML=bars.map(b=>`
    <div class="res-row">
      <div class="res-lbl"><span class="rd" style="background:${b.dot}"></span>${b.lbl}</div>
      <div class="res-bg"><div class="res-fill" style="width:0%;background:${b.col}" data-w="${Math.round(b.v/max*100)}"></div></div>
      <div class="res-val">${b.v}</div>
    </div>`).join('');

  let em,title,msg;
  if(total===0){em='🚦';title='Noch keine Stimmen';msg='Tippt auf eine Ampelfarbe — dann geht es los!';}
  else{
    const top=Math.max(counts.r,counts.y,counts.g);
    const leaders=['r','y','g'].filter(k=>counts[k]===top);
    if(leaders.length>1){
      em='🌈';title='Gemischtes Bild!';
      msg='Toll, dass ihr so ehrlich seid! Jede Meinung zählt — zusammen lernen wir weiter. 💛';
    }else if(leaders[0]==='g'){
      em='🎉';title='Wow, richtig stark!';
      msg='Die meisten von euch haben alles gut verstanden! Ihr seid ein super Team — weiter so! 🌟';
    }else if(leaders[0]==='y'){
      em='💪';title='Fast am Ziel!';
      msg='Die meisten sind schon fast so weit. Mit ein bisschen Übung schaffen wir das gemeinsam! 🚀';
    }else{
      em='🤗';title='Kein Problem!';
      msg='Viele brauchen noch etwas Übung — das ist ganz normal und mutig, das zu zeigen. Wir üben zusammen weiter, dann klappt es bestimmt! 🌱';
    }
  }
  document.getElementById('resEm').textContent=em;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resMsg').textContent=msg;
  document.getElementById('rOverlay').classList.add('show');
  if(total>0&&(counts.g>=counts.r&&counts.g>=counts.y))confetti(CFCOL.g);
  setTimeout(()=>{document.querySelectorAll('.res-fill').forEach(f=>f.style.width=f.dataset.w+'%');},80);
}
function closeResult(){document.getElementById('rOverlay').classList.remove('show');}

/* ── RESET ── */
function resetAll(){
  counts={r:0,y:0,g:0};
  ['R','Y','G'].forEach(x=>document.getElementById('num'+x).textContent='0');
  document.getElementById('tlHint').textContent='Tippe auf deine Farbe! 🚦';
  ['lightR','lightY','lightG'].forEach(id=>document.getElementById(id).classList.remove('picked'));
  toast('Neu gestartet! 🔄');
}

/* ── CONFETTI + TOAST ── */
function confetti(cols){
  for(let i=0;i<70;i++){const p=document.createElement('div');p.className='cf';
    const c=cols[~~(Math.random()*cols.length)];
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${c};width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.4+Math.random()*1.8}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(p);p.addEventListener('animationend',()=>p.remove());}
}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3000);}
</script>
</body>
</html>
