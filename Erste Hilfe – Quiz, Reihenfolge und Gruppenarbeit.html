<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erste Hilfe – Quiz, Reihenfolge und Gruppenarbeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4D6;--bg2:#FFE08A;--card:#ffffff;--ink:#2b2240;--muted:#5b5270;
  --red:#E63946;--blue:#1C7ED6;--green:#2F9E5B;--yellow:#FFC93C;--line:#eadfc4;
  --ok:#d9f7e4;--bad:#ffe1e1;--shadow:0 7px 0 rgba(43,34,64,.14);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a36;--bg2:#2d2858;--card:#2b2748;--ink:#fff8ff;--muted:#d4cdee;--line:#453f73;
    --ok:#1d4a33;--bad:#5a2430;--shadow:0 7px 0 rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a36;--bg2:#2d2858;--card:#2b2748;--ink:#fff8ff;--muted:#d4cdee;--line:#453f73;
  --ok:#1d4a33;--bad:#5a2430;--shadow:0 7px 0 rgba(0,0,0,.35);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 60%);background-attachment:fixed;color:var(--ink);
  font-family:'Andika','Century Gothic','Trebuchet MS','Comic Sans MS',sans-serif;
  font-size:clamp(17px,2.1vw,21px);line-height:1.4}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky i{position:absolute;bottom:-70px;font-style:normal;opacity:.3;animation:floatUp linear infinite}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:14px 16px 60px}

.btn{font:inherit;font-weight:700;border:3px solid transparent;border-radius:18px;padding:12px 20px;background:var(--blue);color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.28);cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:8px 14px;font-size:.9em;border-radius:14px}
.btn.big{font-size:1.1em;padding:15px 26px;background:var(--green)}
.btn.on{background:var(--yellow);color:#2b2240;border-color:#e0a800}
:focus-visible{outline:5px solid var(--yellow);outline-offset:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}

/* Startseite */
.hero{text-align:center;padding:4px 0}
.siren{font-size:46px;display:inline-block;animation:siren .7s steps(2) infinite}
.hero h1{margin:2px 0 0;font-size:clamp(34px,6.5vw,60px);line-height:1.05;color:var(--red);text-shadow:0 4px 0 rgba(0,0,0,.12)}
.hero h1 .heart{display:inline-block;animation:beat 1s ease-in-out infinite}
.hero p{margin:6px 0 0;color:var(--muted)}
.ekg{display:block;width:min(520px,92%);height:54px;margin:4px auto 0}
.ekg polyline{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;animation:ekg 2.2s linear infinite}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}
.cat{font:inherit;color:#fff;border:0;border-radius:30px;padding:24px 20px;cursor:pointer;text-align:center;box-shadow:0 9px 0 rgba(0,0,0,.25);transition:transform .15s}
.cat:hover{transform:translateY(-5px) rotate(-.6deg)}
.cat .em{font-size:72px;display:block;line-height:1.1;animation:bob 2.4s ease-in-out infinite}
.cat b{display:block;font-size:1.4em;margin-top:6px}
.cat span.d{display:block;font-size:.85em;opacity:.95}
.cat.q{background:linear-gradient(160deg,#ff6b6b,#E63946)}
.cat.o{background:linear-gradient(160deg,#4dabf7,#1C7ED6)}
.cat.g{background:linear-gradient(160deg,#51cf66,#2F9E5B)}
.cat.g .em{animation-delay:.5s}

.sub{font-size:1.2em;margin:16px 4px 10px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tcard{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:5px solid var(--c);border-radius:24px;
  padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;display:block;width:100%}
.tcard:hover{transform:translateY(-4px)}
.tcard .ico{font-size:44px;display:block;line-height:1.1}
.tcard b{display:block;font-size:1.05em;margin:4px 0 2px}
.tcard span.d{display:block;font-size:.8em;color:var(--muted)}
.tcard .bs{display:block;margin-top:6px;font-size:.82em;font-weight:700}
.setbox{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:14px 16px;margin:16px 0;display:grid;gap:14px}
.setrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.setrow .cl{font-weight:700;width:100%;text-align:center}
.setrow .cn{min-width:2.2em;text-align:center;font-size:1.6em;background:var(--bg);border:4px solid var(--line);border-radius:14px;padding:0 10px}
.setrow .btn.sm{min-width:52px}
.setnote{font-size:.8em;color:var(--muted);text-align:center;margin:-6px 0 0}
.mix{text-align:center}

.road{position:relative;height:90px;overflow:hidden;margin-top:22px}
.road::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 60px);opacity:.7;animation:lane .6s linear infinite}
.amb{position:absolute;bottom:10px;left:0;font-size:58px;line-height:1;animation:drive 8s linear infinite}
.amb .light{position:absolute;top:-20px;left:16px;font-size:26px;animation:siren .5s steps(2) infinite}

/* Spielkopf */
.top{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.prog{flex:1 1 140px;height:20px;border-radius:12px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));border-radius:12px;transition:width .5s}
.starbox{font-weight:700;background:var(--card);border-radius:14px;padding:5px 12px;border:3px solid var(--line)}
.count{font-size:.85em;color:var(--muted);margin:0 4px 6px}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow)}

.badge{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.badge .circle{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:5px solid var(--c,var(--red));position:relative}
.badge .circle::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c,var(--red));opacity:0;animation:ripple 1.8s ease-out infinite}
.badge .e{font-size:52px;line-height:1;display:inline-block}
.badge .tg{font-weight:700;font-size:1.05em;background:var(--c,var(--red));color:#fff;border-radius:999px;padding:6px 18px}
.a-bounce{animation:bob 1.6s ease-in-out infinite}
.a-flick{animation:flick .45s ease-in-out infinite;transform-origin:50% 90%}
.a-buzz{animation:buzz 1.8s ease-in-out infinite}
.a-ring{animation:ring 1.2s ease-in-out infinite}
.a-beat{animation:beat 1s ease-in-out infinite}
.a-blink{animation:siren .6s steps(2) infinite}
.a-wob{animation:wob 1.6s ease-in-out infinite}
.a-pop{animation:pulse 1.2s ease-in-out infinite}

.prompt{display:flex;gap:10px;align-items:flex-start;margin:14px 4px 12px}
.prompt p{margin:0;flex:1;font-size:clamp(20px,2.8vw,27px);line-height:1.35;font-weight:700}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:620px){.opts.two{grid-template-columns:1fr}}
.opt{font:inherit;font-size:clamp(17px,2.3vw,22px);text-align:left;display:flex;gap:12px;align-items:center;
  background:var(--card);color:var(--ink);border:4px solid var(--line);border-radius:20px;padding:12px 16px;
  min-height:62px;cursor:pointer;box-shadow:0 5px 0 var(--line);line-height:1.3;width:100%}
.opt .let{flex:none;width:42px;height:42px;border-radius:50%;background:var(--yellow);color:#2b2240;display:grid;place-items:center;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--ok);border-color:var(--green);animation:pop .4s}
.opt.wrong{background:var(--bad);border-color:var(--red);animation:shake .4s}
.opt:disabled{cursor:default}
.opt.red{background:#ffd9d9;color:#4a0b12;border-color:var(--red)}
.opt.green{background:#d4f5df;color:#0c3a21;border-color:var(--green)}
.opt.red .let,.opt.green .let{background:#fff;font-size:1.2em}
.opt.red.wrong,.opt.green.wrong{background:#ffb3b3}
.hint{font-weight:700;color:var(--blue);margin:12px 4px 0;min-height:1.4em}
.hint.bad{color:var(--red)}

/* Reihenfolge: erst Satz antippen, dann Nummer */
.ordgrid{display:grid;gap:16px}
@media (min-width:900px){.solo .ordgrid{grid-template-columns:1fr 1fr;align-items:start}}
.otitle{font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:.95em}
.step{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;flex:none}
.pool{display:grid;gap:10px}
.scard{font:inherit;font-size:clamp(16px,2vw,20px);text-align:left;width:100%;background:var(--card);color:var(--ink);
  border:4px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--line);line-height:1.3;transition:transform .12s}
.scard:hover:not(:disabled){border-color:var(--blue)}
.scard.sel{border-color:#e0a800;background:#fff3bf;color:#2b2240;transform:scale(1.03);box-shadow:0 0 0 5px rgba(255,201,60,.55)}
.empty{color:var(--muted);font-weight:700;padding:8px}
.slots{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.slot{font:inherit;display:flex;align-items:center;gap:12px;min-height:58px;border:4px dashed var(--line);border-radius:16px;
  padding:6px 12px;font-size:clamp(16px,2vw,20px);background:transparent;color:var(--ink);width:100%;text-align:left;cursor:pointer;line-height:1.3}
.slot:disabled{cursor:default}
.slot b{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.1em}
.slot .ph{color:var(--muted);opacity:.7}
.slot.full{border-style:solid;border-color:var(--blue);background:var(--card)}
.slot.sel{border-style:solid;border-color:#e0a800;background:#fff3bf;color:#2b2240}
.slot.lock{border-style:solid;border-color:var(--green);background:var(--ok);animation:pop .35s}
.slot.lock b{background:var(--green)}
.slot.miss{border-style:solid;border-color:var(--red);background:var(--bad);animation:shake .4s}
.slots.armed .slot:not(:disabled):not(.sel){animation:glow 1s ease-in-out infinite}
.checkrow{text-align:center;margin-top:16px}

.fb{margin-top:16px;border-radius:22px;padding:16px;background:var(--ok);border:4px solid var(--green);animation:pop .4s}
.fb h3{margin:0 0 6px;font-size:1.2em}
.fb p{margin:0 0 12px;font-size:clamp(17px,2.2vw,21px);line-height:1.45}
.fb ol{margin:0 0 12px;padding-left:1.4em;font-size:clamp(16px,2vw,20px)}
.fb ol li{margin:3px 0}

.res{text-align:center}
.res .medal{font-size:110px;line-height:1;animation:bob 1.6s ease-in-out infinite}
.res h2{font-size:clamp(30px,5.5vw,48px);margin:8px 0;color:var(--red)}
.res .big-stars{font-size:clamp(28px,5vw,44px);margin:8px 0}
.res .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.vs div{border-radius:22px;padding:16px;color:#fff;font-weight:700;font-size:1.15em}
.vs div span{display:block;font-size:1.5em}

/* Gruppenarbeit: geteilter Bildschirm */
.gbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px}
.gbar b{font-size:1.1em}
.split{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 10px 14px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
@media (min-width:821px){.split .panel{height:calc(100vh - 76px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto}}
.panel{border:5px solid var(--gc);border-radius:24px;padding:10px;background:var(--bg)}
.ghead{display:flex;justify-content:space-between;align-items:center;background:var(--gc);color:#fff;border-radius:16px;padding:7px 14px;font-weight:700;margin-bottom:8px}
.panel .card{padding:12px;border-radius:20px}
.panel .badge .circle{width:72px;height:72px}
.panel .badge .e{font-size:38px}
.panel .badge .tg{font-size:.9em;padding:4px 12px}
.panel .prompt p{font-size:clamp(17px,1.8vw,22px)}
.panel .opt{font-size:clamp(15px,1.55vw,19px);min-height:50px;padding:8px 12px}
.panel .opt .let{width:34px;height:34px}
.panel .scard,.panel .slot{font-size:clamp(14px,1.45vw,18px)}
.panel .slot b{width:34px;height:34px}
.panel .fb p,.panel .fb ol{font-size:clamp(15px,1.5vw,19px)}
.panel .btn.big{font-size:1em;padding:11px 20px}
.gdone{text-align:center;padding:30px 10px}
.gdone .big{font-size:76px;animation:bob 1.6s ease-in-out infinite}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#confetti i{position:absolute;top:-30px;font-style:normal;animation:fall linear forwards}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@keyframes siren{0%,100%{opacity:1;filter:hue-rotate(0deg)}50%{opacity:.35;filter:hue-rotate(180deg)}}
@keyframes ekg{from{stroke-dashoffset:420}to{stroke-dashoffset:-420}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(.92,1.12) rotate(2deg)}}
@keyframes buzz{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-12px,-7px) rotate(-12deg)}50%{transform:translate(9px,4px) rotate(8deg)}75%{transform:translate(-5px,7px) rotate(-6deg)}}
@keyframes ring{0%,40%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-16deg)}10%,20%,30%{transform:rotate(16deg)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ripple{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@keyframes glow{0%,100%{border-color:var(--line)}50%{border-color:#e0a800}}
@keyframes drive{from{transform:translateX(calc(100vw + 40px))}to{transform:translateX(-200px)}}
@keyframes lane{to{background-position:-60px 0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(360deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main id="app"></main>
<div id="confetti" aria-hidden="true"></div>

<script>
(function(){
'use strict';

/* ================= QUIZ-FRAGEN =================
   c = richtige Antwort, w = 3 falsche Antworten (je nach Einstellung werden 1, 2 oder 3 gezeigt)
   b = Frage mit zwei festen Knöpfen, r = Index der richtigen Antwort */
const BIN={
  ampel:[{t:'Ich muss sofort die 112 anrufen.',ico:'📞',cls:'red'},{t:'Es reicht, einen Erwachsenen zu holen.',ico:'🧑',cls:'green'}],
  abstand:[{t:'Ich gehe hin und helfe.',ico:'🤝',cls:'green'},{t:'Ich halte Abstand und hole Hilfe.',ico:'✋',cls:'red'}],
  hilft:[{t:'Das hilft!',ico:'👍',cls:'green'},{t:'Das hilft nicht!',ico:'👎',cls:'red'}]
};
const QUIZ=[
 {id:'wunden',ico:'🩹',n:'Verletzungen',d:'Schürfwunde, Verbrennung, Stich, Prellung, Beule, Nasenbluten',c:'#E63946',qs:[
  {i:'🦵',tag:'Schürfwunde',p:'Hannes ist beim Fußball gestürzt. Sein Knie ist aufgeschürft und blutet. Was soll er zuerst tun?',
   c:'Er setzt sich hin und hält das Bein hoch.',w:['Er rennt sofort weiter.','Er kratzt an der Wunde.','Er wischt mit der schmutzigen Hand darüber.'],
   e:'Das verletzte Kind setzt oder legt sich hin. Das verletzte Körperteil wird hochgehalten. So lässt die Blutung schneller nach.'},
  {i:'🦵',tag:'Schürfwunde',p:'Die Wunde von Hannes ist schmutzig. Was tust du?',
   c:'Ich reinige die Wunde vorsichtig mit sauberem Wasser und klebe ein Pflaster darauf.',w:['Ich berühre die Wunde mit meinen Fingern.','Ich klebe einfach ein Pflaster auf den Schmutz.','Ich puste den Schmutz weg und gehe weiter.'],
   e:'Kleine Wunden säuberst du mit frischem Leitungswasser und schützt sie mit einem Pflaster. Bei starker Blutung oder stark verschmutzten Wunden holst du einen Erwachsenen.'},
  {i:'🦵',tag:'Wunde',p:'Warum fasst du eine Wunde nicht mit schmutzigen Fingern an?',
   c:'Damit kein Schmutz in die Wunde gelangt.',w:['Damit die Wunde schneller blutet.','Damit das Pflaster besser klebt.','Weil die Finger sonst kalt werden.'],
   e:'Schmutz gehört nicht in eine Wunde. Darum fassen wir sie nicht mit schmutzigen Fingern an.'},
  {i:'✂️',tag:'Schnittwunde',p:'Ben hat sich beim Basteln leicht in den Finger geschnitten. Es blutet nur wenig. Was tust du?',
   c:'Ich nehme ein Pflaster und schütze die Wunde vor Schmutz.',w:['Ich nehme die Rettungsdecke.','Ich lasse die Wunde offen und bastle weiter.','Ich lege Eis auf den Finger.'],
   e:'Ein Pflaster schützt eine kleine Wunde vor Schmutz. Ist die Wunde groß oder blutet sie stark, holst du einen Erwachsenen.'},
  {i:'🔥',tag:'Verbrennung',p:'Amira hat sich an einem Topf leicht verbrannt. Die Stelle ist rot und tut weh. Was tut sie?',
   c:'Sie hält die Stelle unter kühles, fließendes Wasser und holt einen Erwachsenen.',w:['Sie legt Eis auf die Haut.','Sie kocht einfach weiter.','Sie schmiert Butter auf die Stelle.'],
   e:'Bei Verbrennungen kühlst du die Stelle sofort mit kühlem, fließendem Wasser. Rufe immer einen Erwachsenen und zeige ihm die Verbrennung.'},
  {i:'🔥',tag:'Verbrennung',p:'Wie lange kühlst du eine verbrannte Stelle?',
   c:'Mindestens 15 bis 20 Minuten.',w:['Nur 5 Sekunden.','Gar nicht.','Nur eine Minute.'],
   e:'Das Wasser soll fließen, aber nicht zu kalt sein. Große Brandwunden muss danach ein Arzt versorgen.'},
  {i:'🔥',tag:'Verbrennung',p:'Was verwendest du bei einer Verbrennung NICHT?',
   c:'Eis und Hausmittel.',w:['Kühles, fließendes Wasser.','Die Hilfe eines Erwachsenen.','Einen Arzt bei großen Brandwunden.'],
   e:'Kein Eis und keine Hausmittel! Nur kühles, fließendes Wasser.'},
  {i:'🐝',tag:'Insektenstich',p:'Eine Wespe hat Katja gestochen. Die Stelle ist rot und dick. Was hilft?',
   c:'Die Stelle sofort kühlen und einen Erwachsenen holen.',w:['Fest kratzen und reiben.','Nichts tun und weiterspielen.','Die Stelle mit Sand einreiben.'],
   e:'Insektenstiche können schmerzhaft sein. Die Einstichstelle schwillt an und wird rot. Du kühlst sie sofort.'},
  {i:'🐝',tag:'Insektenstich',p:'Nach dem Stich geht es Katja plötzlich sehr schlecht. Sie bekommt schlecht Luft. Was tust du?',
   c:'Ich rufe sofort Hilfe und wähle die 112.',w:['Ich warte erst einmal ab.','Ich gebe ihr etwas Süßes.','Ich schicke sie allein nach Hause.'],
   e:'Manche Menschen sind allergisch gegen Insektengift. Dann ist ein Stich besonders gefährlich. Es muss sofort ein Arzt gerufen werden.'},
  {i:'💥',tag:'Prellung',p:'Luca ist gegen eine Tür gerannt. Sein Arm wird dick und blau. Was tust du?',

  s:['Ich setze mich hin.','Ich beuge den Kopf nach vorne.','Ich drücke die Nasenflügel einige Minuten vorsichtig zusammen.','Ein kühles Tuch kommt in den Nacken.','Hört es nicht auf, rufe ich einen Erwachsenen.'],
  e:'Lege den Kopf nicht nach hinten!'}
];

const app=document.getElementById('app');
const TOTALQ=QUIZ.reduce((a,t)=>a+t.qs.length,0);
const SET={opts:3,q:12,o:ORDER.length,g:'quiz',gt:'mix',gn:5};
const best={};
let sound=true;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PRAISE=['Super!','Richtig!','Toll gemacht!','Prima!','Klasse!','Bravo!'];
const ANIM={'🔥':'a-flick','🐝':'a-buzz','📞':'a-ring','🚨':'a-blink','💥':'a-pop','✂️':'a-wob','🩹':'a-wob','🧤':'a-wob','⚡':'a-blink','💨':'a-wob','🤕':'a-wob','💛':'a-beat','🫂':'a-beat','⛓️':'a-wob','✨':'a-pop','📣':'a-ring','⚠️':'a-blink','🔌':'a-wob','🗣️':'a-ring'};
const badge=(e,tag,c)=>`<div class="badge" style="--c:${c}"><div class="circle"><span class="e ${ANIM[e]||'a-bounce'}">${e}</span></div><span class="tg">${tag}</span></div>`;
const quizPool=id=>id==='mix'?QUIZ.flatMap(t=>t.qs.map(q=>Object.assign({c0:t.c},q))):QUIZ.find(x=>x.id===id).qs.map(q=>Object.assign({c0:QUIZ.find(x=>x.id===id).c},q));
const orderPool=id=>id==='notfall'?ORDER.slice(0,6):id==='verl'?ORDER.slice(6):ORDER.slice();

let ac;
function tone(f,t,d,type,v){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v||.15,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);
    o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d+.02);}catch(e){}
}
const sfx={ok:()=>{tone(660,0,.12);tone(880,.1,.22)},tap:()=>tone(520,0,.08,'sine',.08),
  bad:()=>tone(180,0,.25,'square',.08),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.28))};
function speak(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
const stopSpeak=()=>{try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}};
function confetti(n){
  const c=document.getElementById('confetti'),em=['🩹','⭐','❤️','✚','🎉','⭐'];
  for(let i=0;i<n;i++){const p=document.createElement('i');p.textContent=em[i%em.length];
    p.style.left=Math.random()*100+'vw';p.style.fontSize=(16+Math.random()*18)+'px';
    p.style.animationDuration=(1.8+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*.3)+'s';
    c.appendChild(p);setTimeout(()=>p.remove(),4000);}
}
const sndBtn=()=>`<button class="btn ghost sm" data-snd="1" aria-label="Ton an oder aus">${sound?'🔊 Ton an':'🔇 Ton aus'}</button>`;
function bindSnd(){document.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>{sound=!sound;
  document.querySelectorAll('[data-snd]').forEach(x=>x.textContent=sound?'🔊 Ton an':'🔇 Ton aus')})}
const road=()=>`<div class="road" aria-hidden="true"><div class="amb"><span class="light">🚨</span>🚑</div></div>`;
const ekg=()=>`<svg class="ekg" viewBox="0 0 300 60" aria-hidden="true"><polyline points="0,32 70,32 85,32 95,8 107,54 118,20 128,32 190,32 200,32 210,12 220,50 230,32 300,32"/></svg>`;
const go=f=>{stopSpeak();f();window.scrollTo(0,0)};
const keep=f=>()=>{const y=window.scrollY;f();window.scrollTo(0,y)};

/* Einstell-Bausteine: Zähler (− / +) und Auswahlknöpfe */
function stepper(key,max,label){
  SET[key]=Math.max(1,Math.min(max,SET[key]));
  const quick=[5,10,15,20,30].filter(x=>x<max).concat([max]);
  return `<div class="setrow" data-key="${key}" data-max="${max}"><span class="cl">${label}</span>
    <button class="btn sm" data-c="-1" aria-label="weniger">−</button><b class="cn">${SET[key]}</b><button class="btn sm" data-c="1" aria-label="mehr">+</button>
    ${quick.map(x=>`<button class="btn ghost sm ${SET[key]===x?'on':''}" data-cv="${x}">${x===max?'Alle ('+max+')':x}</button>`).join('')}</div>`;
}
function choice(key,list,label){
  return `<div class="setrow" data-ch="${key}"><span class="cl">${label}</span>${list.map(o=>`<button class="btn ghost sm ${String(SET[key])===String(o.v)?'on':''}" data-v="${o.v}">${o.l}</button>`).join('')}</div>`;
}
function bindSettings(re){
  app.querySelectorAll('[data-key]').forEach(box=>{
    const k=box.dataset.key,max=+box.dataset.max;
    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{SET[k]=Math.min(max,Math.max(1,SET[k]+(+b.dataset.c)));sfx.tap();re()});
    box.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{SET[k]=+b.dataset.cv;sfx.tap();re()});
  });
  app.querySelectorAll('[data-ch]').forEach(box=>{
    const k=box.dataset.ch;
    box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;SET[k]=isNaN(+v)?v:+v;
      if(k==='g')SET.gt=(v==='quiz'?'mix':'all');
      sfx.tap();re();
    });
  });
}
const optsChoice=()=>choice('opts',[{v:2,l:'2'},{v:3,l:'3'},{v:4,l:'4'}],'Wie viele Antworten zur Auswahl?')+
  '<p class="setnote">Fragen mit Rot/Grün oder 👍/👎 haben immer 2 Antworten.</p>';

/* ================= Spieler (für Einzelspiel und für jede Gruppe) ================= */
function Player(root,cfg){
  const list=cfg.list,n=list.length,G=cfg.group,P={i:0,stars:0,n,last:0};
  let mist=0,done=false,place,lock,pool,sel;
  const $=s=>root.querySelector(s);
  const hint=(t,bad)=>{const h=$('.hint');if(h){h.textContent=t;h.classList.toggle('bad',!!bad)}};
  function shell(inner){
    root.innerHTML=(G?`<div class="ghead"><span>${G.name}</span><span class="st">⭐ ${P.stars}</span></div>`:'')+
      `<div class="top">${G?'':'<button class="btn ghost sm bk">⬅ Zurück</button>'}
        <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${P.i}"><span style="width:${P.i/n*100}%"></span></div>
        ${G?'':`<div class="starbox st">⭐ ${P.stars}</div>${sndBtn()}`}</div>
      <div class="count">${cfg.mode==='quiz'?'Frage':'Aufgabe'} ${P.i+1} von ${n}</div>
      <div class="card">${inner}<div class="hint" aria-live="polite"></div><div class="fbx"></div></div>`;
    const bk=$('.bk');if(bk)bk.onclick=cfg.onExit;
    if(!G)bindSnd();
  }
  function success(text,extra){
    done=true;const g=mist===0?3:mist===1?2:1;P.stars+=g;P.last=g;
    $('.st').textContent='⭐ '+P.stars;hint('');sfx.ok();confetti(G?12:18+g*8);
    const last=P.i===n-1,fb=$('.fbx');
    fb.innerHTML=`<div class="fb"><h3>${pick(PRAISE)} ${'⭐'.repeat(g)}</h3>${extra||''}<p>${text}</p><button class="btn big nx">${last?'Fertig 🎉':'Weiter ➜'}</button></div>`;
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
    const nb=$('.nx');
    nb.onclick=()=>{stopSpeak();P.i++;P.i<n?show():cfg.onDone(P)};
    nb.focus({preventScroll:true});
  }
  function show(){
    mist=0;done=false;
    (cfg.mode==='quiz'?showQ:showO)();
    if(G)root.scrollTop=0;else window.scrollTo(0,0);
  }

  /* --- Quiz --- */
  function showQ(){
    const q=list[P.i];
    const opts=q.b?BIN[q.b].map((o,i)=>Object.assign({ok:i===q.r},o))
      :shuffle([{t:q.c,ok:true},...shuffle(q.w).slice(0,cfg.nOpts-1).map(t=>({t,ok:false}))]);
    const prompt=q.b==='ampel'?q.p+'<br>Rot oder grün?':q.b==='hilft'?'Ein Kind ist verletzt. „'+q.p+'“ Hilft das?':q.b==='abstand'?q.p+'<br>Gehst du hin?':q.p;
    shell(`${badge(q.i,q.tag,q.c0)}
      <div class="prompt"><p>${prompt}</p><button class="btn sm say" aria-label="Vorlesen">🔊</button></div>
      <div class="opts${q.b?' two':''}">${opts.map((o,i)=>`<button class="opt ${o.cls||''}" data-i="${i}"><span class="let">${o.ico||'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>`);
    const read=prompt.replace(/<br>/g,'. ')+'. '+opts.map((o,i)=>(o.ico?'':'ABCD'[i]+': ')+o.t).join('. ');
    $('.say').onclick=()=>speak(read);
    root.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{
      if(done)return;
      const o=opts[+b.dataset.i];
      if(o.ok){b.classList.add('right');root.querySelectorAll('.opts .opt').forEach(x=>x.disabled=true);success(q.e)}
      else{b.classList.add('wrong');b.disabled=true;mist++;sfx.bad();hint('Fast! Versuch es noch einmal. 💪',true)}
    });
  }

  /* --- Reihenfolge: 1. Satz antippen, 2. Nummer antippen --- */
  function showO(){
    const t=list[P.i];
    place=t.s.map(()=>null);lock=t.s.map(()=>false);pool=shuffle(t.s.map((_,i)=>i));sel=null;
    shell(`${badge(t.i,t.n,t.c)}
      <div class="prompt"><p>${t.task}</p><button class="btn sm say" aria-label="Vorlesen">🔊</button></div>
      <div class="ord"></div>`);
    $('.say').onclick=()=>speak(t.task+' Die Sätze sind: '+pool.map(i=>t.s[i]).join('. '));
    drawO();
    hint('Tippe zuerst auf einen Satz. Dann tippe auf die Nummer, wo er hinkommt.');
  }
  function drawO(miss){
    const t=list[P.i],box=$('.ord'),busy=!!miss;
    const free=pool.filter(i=>!place.includes(i));
    const full=place.every(x=>x!==null);
    box.innerHTML=`<div class="ordgrid">
      <div><div class="otitle"><span class="step">1</span>Tippe auf einen Satz</div>
        <div class="pool">${free.length?free.map(i=>`<button class="scard ${sel&&sel.f==='p'&&sel.v===i?'sel':''}" data-p="${i}" ${busy||done?'disabled':''}>${t.s[i]}</button>`).join('')
          :'<div class="empty">Alle Sätze haben eine Nummer. 👍</div>'}</div></div>
      <div><div class="otitle"><span class="step">2</span>Tippe auf die Nummer</div>
        <ol class="slots ${sel?'armed':''}">${place.map((p,s)=>{
          const cls=lock[s]?'lock':(miss&&miss.includes(s)?'miss':(sel&&sel.f==='s'&&sel.v===s?'sel':(p!==null?'full':'')));
          return `<li><button class="slot ${cls}" data-s="${s}" ${lock[s]||done||busy?'disabled':''} aria-label="Nummer ${s+1}">
            <b>${lock[s]?'✔':s+1}</b><span class="${p===null?'ph':''}">${p!==null?t.s[p]:'frei'}</span></button></li>`}).join('')}</ol></div>
      </div>
      <div class="checkrow"><button class="btn big chk" ${full&&!done&&!busy?'':'disabled'}>✔ Prüfen</button></div>`;
    box.querySelectorAll('.scard').forEach(b=>b.onclick=()=>{
      if(done)return;
      const v=+b.dataset.p;
      sel=(sel&&sel.f==='p'&&sel.v===v)?null:{f:'p',v};
      sfx.tap();drawO();
      hint(sel?'Gut! Jetzt tippe auf die passende Nummer.':'Tippe zuerst auf einen Satz.');
    });
    box.querySelectorAll('.slot:not([disabled])').forEach(b=>b.onclick=()=>{
      if(done)return;
      const s=+b.dataset.s;
      if(sel&&sel.f==='p'){place[s]=sel.v;sel=null}
      else if(sel&&sel.f==='s'){
        if(sel.v===s){place[s]=null}
        else{const tmp=place[s];place[s]=place[sel.v];place[sel.v]=tmp}
        sel=null;
      }
      else if(place[s]!==null){
        sel={f:'s',v:s};sfx.tap();drawO();
        hint('Tippe auf eine andere Nummer, dann wird getauscht. Tippst du nochmal auf diese Nummer, geht der Satz zurück.');
        return;
      }
      else{hint('Tippe zuerst auf einen Satz, dann auf die Nummer.');return}
      sfx.tap();drawO();
      const isFull=place.every(x=>x!==null);
      hint(isFull?'Alle Sätze haben eine Nummer. Drücke auf „Prüfen“!':'Super! Jetzt der nächste Satz.');
      if(isFull)$('.chk').focus({preventScroll:true});
    });
    $('.chk').onclick=checkO;
  }
  function checkO(){
    const t=list[P.i],wrong=[];
    place.forEach((p,s)=>{if(p===s)lock[s]=true;else wrong.push(s)});
    sel=null;
    if(!wrong.length){drawO();success(t.e,`<ol>${t.s.map(x=>`<li>${x}</li>`).join('')}</ol>`);return}
    mist++;sfx.bad();
    drawO(wrong);
    hint(`${t.s.length-wrong.length} von ${t.s.length} Sätzen sind richtig. Die roten Sätze gehen zurück. Versuch es nochmal! 💪`,true);
    setTimeout(()=>{wrong.forEach(s=>place[s]=null);if(!done)drawO()},1100);
  }

  show();
  return P;
}

function startQuiz(id){

}
function startOrder(id){
  const make=()=>id==='mix'?shuffle(ORDER).slice(0,SET.o):[ORDER.find(o=>o.id===id)];

}
function solo(mode,key,make){
  stopSpeak();
  app.innerHTML=`<section class="wrap solo"><div class="pl"></div></section>`;
  Player(app.querySelector('.pl'),{mode,list:make(),nOpts:SET.opts,
    onExit:()=>go(mode==='quiz'?quizMenu:orderMenu),
    onDone:P=>soloResult(mode,key,make,P)});

function soloResult(mode,key,make,P){
  stopSpeak();
  const max=P.n*3,pct=P.stars/max;
  const m=pct>=.85?['🥇','Erste-Hilfe-Profi!']:pct>=.6?['🥈','Super Helfer!']:['🥉','Gut gemacht! Übe weiter!'];

  if(mode==='order'&&key!=='mix')best['o_'+key]=Math.max(best['o_'+key]||0,P.last);

function groupPlay(){
  stopSpeak();
  const pool=shuffle(SET.g==='quiz'?quizPool(SET.gt):orderPool(SET.gt));
  const n=Math.max(1,Math.min(SET.gn,Math.floor(pool.length/2)));
  const lists=[pool.slice(0,n),pool.slice(n,2*n)];
  app.innerHTML=`<div class="gbar"><button class="btn ghost sm" id="gend">⬅ Beenden</button><b>👥 Gruppenarbeit</b>${sndBtn()}</div>
    <div class="split"><div class="panel" style="--gc:${GROUPS[0].c}"></div><div class="panel" style="--gc:${GROUPS[1].c}"></div></div>`;
  document.getElementById('gend').onclick=()=>go(groupSetup);
  bindSnd();
  const res=[null,null];
  app.querySelectorAll('.panel').forEach((root,k)=>{
    Player(root,{mode:SET.g,list:lists[k],nOpts:SET.opts,group:GROUPS[k],onDone:P=>{
      res[k]={stars:P.stars,max:P.n*3};
      sfx.win();confetti(30);
      root.innerHTML=`<div class="ghead"><span>${GROUPS[k].name}</span><span>⭐ ${P.stars}</span></div>
        <div class="gdone"><div class="big">🎉</div><h3>${GROUPS[k].name} ist fertig!</h3>
        <p>⭐ ${P.stars} von ${P.n*3} Sternen</p><p>${res[1-k]?'':'Wartet auf die andere Gruppe …'}</p></div>`;
      if(res[0]&&res[1])setTimeout(()=>groupResult(res),1200);
    }});
  });
  window.scrollTo(0,0);
}
function groupResult(res){
  stopSpeak();
  const [a,b]=res;
  const title=a.stars>b.stars?'🏆 '+GROUPS[0].name+' gewinnt!':b.stars>a.stars?'🏆 '+GROUPS[1].name+' gewinnt!':'🤝 Unentschieden!';
  sfx.win();confetti(90);
  app.innerHTML=`<section class="wrap res">
    <div class="row"><span></span>${sndBtn()}</div>
    <div class="medal" aria-hidden="true">🏆</div><h2>${title}</h2>
    <div class="vs"><div style="background:${GROUPS[0].c}">${GROUPS[0].name}<span>⭐ ${a.stars}</span>von ${a.max}</div>
      <div style="background:${GROUPS[1].c}">${GROUPS[1].name}<span>⭐ ${b.stars}</span>von ${b.max}</div></div>
    <p>Beide Gruppen sind tolle Erste-Hilfe-Helfer!</p>
    <div class="btns"><button class="btn big" id="again">🔁 Nochmal mit neuen Fragen</button><button class="btn" id="setg">⚙️ Einstellungen</button><button class="btn ghost" id="home2">🏠 Start</button></div>
    ${road()}</section>`;
  document.getElementById('again').onclick=groupPlay;
  document.getElementById('setg').onclick=()=>go(groupSetup);
  document.getElementById('home2').onclick=()=>go(home);
  bindSnd();window.scrollTo(0,0);
}

/* schwebende Erste-Hilfe-Zeichen im Hintergrund */
(function(){
  const sky=document.getElementById('sky'),em=['✚','🩹','❤️','🚑','⭐','🩺','✚','🧰'];
  for(let i=0;i<16;i++){const e=document.createElement('i');e.textContent=em[i%em.length];
    e.style.left=(Math.random()*96)+'vw';e.style.fontSize=(20+Math.random()*26)+'px';
    e.style.animationDuration=(16+Math.random()*18)+'s';e.style.animationDelay=(-Math.random()*30)+'s';
    if(em[i%em.length]==='✚')e.style.color='#E63946';sky.appendChild(e);}
})();

home();
})();
</script>
</body>
</html>
